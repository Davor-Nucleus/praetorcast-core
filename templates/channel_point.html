<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Channel Points</title>
    <!-- Thème commun : police, couleurs et rayons viennent de /settings. -->
    <link id="pc-theme" rel="stylesheet" href="/theme.css">
    <script src="/public/js/theme-live.js" defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--pc-bg) !important;
            color: var(--pc-text);
            font-family: var(--pc-font);
            overflow: hidden;
        }

        .cp-overlay {
            position: fixed;
            inset: 0;
        }

        /* Une récompense occupe tout l'écran : image au-dessus, phrase en dessous. */
        .reward-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1rem, 3vh, 2.5rem);
            padding: clamp(1rem, 4vw, 4rem);
            opacity: 0;
        }

        .reward-image {
            height: clamp(160px, 40vh, 480px);
            width: auto;
            max-width: min(80vw, 900px);
            object-fit: contain;
            border-radius: var(--pc-radius);
        }

        /* La phrase passe par le moteur de /text (partials/_text_render.html) :
           animation d'entrée et effet continu réglés par ligne dans
           /channel-points-config. Ici, seule la géométrie : la scène du moteur
           occupe 100 % de la hauteur, elle doit se limiter à son texte sous l'image. */
        .reward-text {
            max-width: 100%;
        }

        .reward-text .text-stage {
            height: auto;
            overflow: visible;
        }

        .reward-text .text-content {
            text-wrap: balance;
            font-size: calc(clamp(2rem, 6vw, 6rem) * var(--pc-font-scale));
        }

        /* Les effets qui découpent un dégradé dans le texte le rendent transparent :
           l'ombre du thème transparaîtrait sous les lettres. */
        .reward-text .fx-gradient,
        .reward-text .fx-rainbow,
        .reward-text .fx-shine {
            text-shadow: none;
        }

        /* Aide au diagnostic hors OBS : n'apparaît que si le navigateur refuse l'autoplay. */
        .audio-hint {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            transform: translateX(-50%);
            max-width: 90vw;
            padding: 0.6rem 1.1rem;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.78);
            color: #ffffff;
            font-family: monospace;
            font-size: 0.9rem;
            text-align: center;
            z-index: 10;
        }

        /* --- Transitions (classes posées par le JS : <type>-in / <type>-out) --- */
        .reward-wrapper.fade-in   { animation: fadeIn   0.8s ease-out both; }
        .reward-wrapper.fade-out  { animation: fadeOut  0.5s ease-in  both; }
        .reward-wrapper.slide-in  { animation: slideIn  0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .reward-wrapper.slide-out { animation: slideOut 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .reward-wrapper.zoom-in   { animation: zoomIn   0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .reward-wrapper.zoom-out  { animation: zoomOut  0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .reward-wrapper.flip-in   { animation: flipIn   0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .reward-wrapper.flip-out  { animation: flipOut  0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        @keyframes slideIn  { from { opacity: 0; transform: translateX(100%); }  to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOut { from { opacity: 1; transform: translateX(0); }     to { opacity: 0; transform: translateX(-100%); } }

        @keyframes zoomIn  { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes zoomOut { from { opacity: 1; transform: scale(1); }    to { opacity: 0; transform: scale(1.08); } }

        @keyframes flipIn  { from { opacity: 0; transform: perspective(1200px) rotateX(90deg); }  to { opacity: 1; transform: perspective(1200px) rotateX(0); } }
        @keyframes flipOut { from { opacity: 1; transform: perspective(1200px) rotateX(0); }      to { opacity: 0; transform: perspective(1200px) rotateX(-90deg); } }
    </style>
</head>
<body>
    <div class="cp-overlay" id="cpOverlay"></div>

    {% include "partials/_text_render.html" %}

    <script>
        // Durée d'affichage quand la récompense n'a pas de son (et filet de sécurité
        // si le fichier audio ne charge pas dans OBS).
        const NO_SOUND_MS = 5000;
        // Marge ajoutée à la durée annoncée par le fichier avant de couper d'office.
        const WATCHDOG_GRACE_MS = 1000;
        // Doit correspondre à la durée des animations `-out` du CSS.
        const OUT_MS = 500;
        // Une alerte dure plusieurs secondes : sur une rafale (un raid suivi de dons
        // d'abonnements), la file finirait par avoir des minutes de retard sur le
        // direct. Au-delà, on préfère perdre des alertes que les jouer en décalé.
        const MAX_QUEUE = 10;

        const pending = [];
        let isPlaying = false;

        // --- File d'attente ---------------------------------------------------

        // Le serveur envoie l'alerte **déjà résolue** : `event` décrit ce qui s'est
        // passé, `config` la ligne de `channel_points.json` retenue pour l'afficher.
        // La sélection (titre exact pour les points de chaîne, palier de montant pour
        // les autres) vit dans `models::channel_point::select`, où elle est testée
        // sans navigateur.
        function enqueue(item) {
            if (!item || !item.config || !item.event) return;
            if (pending.length >= MAX_QUEUE) {
                console.warn('File pleine, alerte ignorée:', item.event.kind);
                return;
            }
            pending.push(item);
            drainQueue();
        }

        // Une seule animation à l'écran : les événements simultanés s'enchaînent.
        async function drainQueue() {
            if (isPlaying) return;
            isPlaying = true;
            try {
                while (pending.length > 0) {
                    const { config, event } = pending.shift();
                    await playRedemption(config, event);
                }
            } finally {
                isPlaying = false;
            }
        }

        // --- Affichage --------------------------------------------------------

        function getTransitionClasses(type, isIn) {
            const base = type || 'fade';
            return isIn ? base + '-in' : base + '-out';
        }

        // Substitue les jetons de la phrase configurée. Les accolades sont échappées
        // dans les regex pour ne pas être interprétées comme des balises Askama.
        //
        // `amount` et `tier` désignent le même champ : selon le type d'alerte il porte
        // des bits, un nombre d'abonnements offerts, de spectateurs ou un palier
        // d'abonnement, et deux noms rendent les phrases lisibles des deux côtés.
        function formatPhrase(phrase, event) {
            return String(phrase || '')
                .replace(/\{\{\s*user\s*\}\}/gi, () => event.user_name || '')
                .replace(/\{\{\s*reward\s*\}\}/gi, () => event.reward_title || '')
                .replace(/\{\{\s*input\s*\}\}/gi, () => event.user_input || '')
                .replace(/\{\{\s*amount\s*\}\}/gi, () => String(event.amount ?? ''))
                .replace(/\{\{\s*tier\s*\}\}/gi, () => formatTier(event.amount))
                .replace(/\{\{\s*months\s*\}\}/gi, () => String(event.months ?? ''));
        }

        // Twitch compte les paliers en 1000 / 2000 / 3000 : personne n'écrit
        // « abonné tier 3000 » dans une alerte.
        function formatTier(amount) {
            const tier = Math.floor(Number(amount || 0) / 1000);
            return tier > 0 ? String(tier) : '1';
        }

        function buildWrapper(config, event) {
            const wrapper = document.createElement('div');
            wrapper.className = 'reward-wrapper';

            if (config.imagePath && config.imagePath.trim() !== '') {
                const image = document.createElement('img');
                image.className = 'reward-image';
                image.src = config.imagePath;
                image.alt = '';
                wrapper.appendChild(image);
            }

            const phrase = formatPhrase(config.phrase, event).trim();
            if (phrase) {
                const holder = document.createElement('div');
                holder.className = 'reward-text';
                // Même rendu que /text : le texte passe par textContent, jamais par
                // du HTML, alors qu'il contient le pseudo et le message du viewer.
                createTextRenderer(holder).render(phraseSection(config, phrase));
                wrapper.appendChild(holder);
            }

            return wrapper;
        }

        /**
         * Section de texte pour le moteur de /text. Une ligne sans réglage garde le
         * rendu d'avant l'arrivée des animations : aucune entrée, dégradé animé.
         * Les périodes des effets sont celles du moteur (`TEXT_EFFECT_PERIODS`).
         */
        function phraseSection(config, phrase) {
            return {
                content: phrase,
                animation: config.textAnimation || 'none',
                effect: config.textEffect || 'gradient',
                align: 'center',
                verticalAlign: 'middle',
                scale: 1,
            };
        }

        // Un navigateur classique refuse `play()` tant que l'utilisateur n'a pas
        // interagi avec la page ; OBS, lui, l'autorise. Plutôt que de laisser une
        // animation muette sans explication, on l'affiche à l'écran.
        let audioHint = null;

        function showAudioHint(onUnlock) {
            if (audioHint) return;

            audioHint = document.createElement('div');
            audioHint.className = 'audio-hint';
            audioHint.textContent = 'Son bloqué par le navigateur : cliquez sur la page pour l\'autoriser (sans objet dans OBS)';
            document.body.appendChild(audioHint);

            const unlock = () => {
                document.removeEventListener('pointerdown', unlock);
                document.removeEventListener('keydown', unlock);
                if (audioHint && audioHint.parentNode) {
                    audioHint.parentNode.removeChild(audioHint);
                }
                audioHint = null;
                onUnlock();
            };

            document.addEventListener('pointerdown', unlock);
            document.addEventListener('keydown', unlock);
        }

        // Cœur de la fonctionnalité : l'affichage dure exactement le temps du son.
        // Le son démarre avec l'animation d'entrée et la sortie est déclenchée par
        // l'événement `ended`. Un watchdog évite de rester bloqué si l'audio cale.
        function holdForSound(soundPath) {
            return new Promise((resolve) => {
                if (!soundPath || soundPath.trim() === '') {
                    setTimeout(resolve, NO_SOUND_MS);
                    return;
                }

                const audio = new Audio(soundPath);
                audio.preload = 'auto';
                let settled = false;
                let watchdog = null;

                function finish() {
                    if (settled) return;
                    settled = true;
                    clearTimeout(watchdog);
                    resolve();
                }

                function arm(delay) {
                    clearTimeout(watchdog);
                    watchdog = setTimeout(finish, delay);
                }

                arm(NO_SOUND_MS);

                audio.addEventListener('loadedmetadata', () => {
                    if (isFinite(audio.duration) && audio.duration > 0) {
                        arm(audio.duration * 1000 + WATCHDOG_GRACE_MS);
                    }
                });
                audio.addEventListener('ended', finish);
                audio.addEventListener('error', finish);

                audio.play().catch((error) => {
                    console.error('Lecture du son impossible:', error);
                    arm(NO_SOUND_MS);

                    if (error && error.name === 'NotAllowedError') {
                        // Au premier clic, on relance le son et on recale le watchdog
                        // sur ce qu'il reste à jouer.
                        showAudioHint(() => {
                            audio.play().then(() => {
                                if (isFinite(audio.duration) && audio.duration > 0) {
                                    arm((audio.duration - audio.currentTime) * 1000 + WATCHDOG_GRACE_MS);
                                }
                            }).catch(() => {});
                        });
                    }
                });
            });
        }

        async function playRedemption(config, event) {
            const overlay = document.getElementById('cpOverlay');
            const transition = config.transition || 'fade';
            const wrapper = buildWrapper(config, event);

            overlay.appendChild(wrapper);
            requestAnimationFrame(() => {
                wrapper.className = 'reward-wrapper ' + getTransitionClasses(transition, true);
            });

            await holdForSound(config.soundPath);

            wrapper.classList.remove(getTransitionClasses(transition, true));
            wrapper.classList.add(getTransitionClasses(transition, false));
            await new Promise((resolve) => setTimeout(resolve, OUT_MS));

            if (wrapper.parentNode) {
                wrapper.parentNode.removeChild(wrapper);
            }
        }

        // --- WebSocket --------------------------------------------------------

        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            let ws;
            try {
                ws = new WebSocket(proto + '://' + location.host + '/api/channel_point_ws');
            } catch (error) {
                // Même délai que la fermeture normale : une source OBS ouverte avant
                // le serveur doit finir par se rattacher toute seule.
                console.error('Channel point WS error:', error);
                setTimeout(connectWs, 2000);
                return;
            }

            ws.addEventListener('message', (message) => {
                let data;
                try {
                    data = JSON.parse(message.data);
                } catch (error) {
                    console.error('Channel point WS parse error:', error);
                    return;
                }

                if (data.type === 'alert') {
                    enqueue({ event: data.event, config: data.config });
                }
            });

            ws.addEventListener('close', () => {
                setTimeout(connectWs, 2000);
            });
        }

        // Déclenche une animation sans passer par Twitch. La configuration est fournie
        // à la main : la sélection d'une ligne selon le type et le palier se fait côté
        // serveur, ce hook ne peut donc exercer que l'affichage et la file d'attente.
        //
        //   testAlert('Merci \{\{user\}\} pour \{\{amount\}\} bits !', { kind: 'cheer', amount: 500 })
        //
        // Les accolades sont échappées jusque dans ce commentaire : Askama compile ce
        // fichier et prendrait une paire nue pour une variable de template. En
        // JavaScript `\{` vaut `{`, la phrase reste donc correcte à l'exécution.
        window.testAlert = function (phrase, event, config) {
            enqueue({
                event: Object.assign(
                    {
                        kind: 'channel_points',
                        reward_title: 'Test',
                        user_name: 'TestUser',
                        user_input: '',
                        amount: 0,
                        months: 0
                    },
                    event || {}
                ),
                config: Object.assign(
                    {
                        phrase: phrase || 'Test \{\{user\}\}',
                        imagePath: '',
                        soundPath: '',
                        transition: 'fade'
                    },
                    config || {}
                )
            });
        };

        window.addEventListener('load', connectWs);
    </script>
</body>
</html>
