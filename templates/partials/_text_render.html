<!--
    Composant « texte animé », partagé par /text et /text-config.

    Même rôle que partials/_goal_bars.html : le rendu existerait sinon en double
    (l'overlay et l'aperçu du configurateur), et deux copies d'une dizaine
    d'animations ne sont pas tenables. L'aperçu montre donc le rendu réel, pas une
    approximation.

    À inclure AVANT le script de la page — `createTextRenderer` doit être défini
    quand la page l'appelle. Le partiel ne style que l'intérieur d'une section ; la
    géométrie du conteneur (plein écran pour l'overlay, cadre borné pour l'aperçu)
    reste à la charge de chaque page.

    Un partiel Askama et pas un fichier de /public/js : `compile/build.cjs` ne
    copie que les .exe, jamais public/. Un nouvel asset n'atteindrait donc jamais
    le dossier d'exécution, alors que les templates sont compilés dans le binaire.
-->
<style>
    /* --- Géométrie ------------------------------------------------------------
       Le conteneur (`.text-stage`) place le bloc selon `align` / `verticalAlign` ;
       le bloc porte le fond et les marges ; la ligne porte l'animation d'entrée ;
       le contenu porte l'effet continu. Quatre niveaux, parce qu'une entrée et un
       effet posent tous deux un `transform` et s'écraseraient sur un seul nœud. */
    .text-stage {
        display: flex;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .text-stage.valign-top    { align-items: flex-start; }
    .text-stage.valign-middle { align-items: center; }
    .text-stage.valign-bottom { align-items: flex-end; }

    .text-stage.align-left   { justify-content: flex-start; }
    .text-stage.align-center { justify-content: center; }
    .text-stage.align-right  { justify-content: flex-end; }

    .text-block {
        max-width: 100%;
        padding: clamp(0.4rem, 1.6vw, 1.6rem) clamp(0.6rem, 2vw, 2rem);
        border-radius: var(--pc-radius);
        /* Vide par défaut : une source navigateur OBS se pose par-dessus un
           gameplay, un fond opaque serait le mauvais défaut. */
        background: var(--text-bg, transparent);
    }

    /* Le marquee traverse toute la largeur : le bloc cesse d'être dimensionné par
       son contenu, et `align` n'a plus de prise (signalé dans le configurateur). */
    .text-stage.has-marquee .text-block {
        width: 100%;
        overflow: hidden;
    }

    .text-line {
        /* `both` sur les entrées : sans lui la ligne repasse à son état initial
           (souvent opacity 0) à la fin de l'animation. */
        animation-fill-mode: both;
    }

    .text-content {
        display: inline-block;
        margin: 0;
        font-family: var(--pc-font);
        font-weight: 700;
        line-height: 1.15;
        color: var(--text-color, var(--pc-text));
        text-shadow: var(--pc-shadow);
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        /* Comme les barres d'objectif : une taille en clamp() se cale seule sur la
           largeur de la source, `--text-scale` ne sert qu'à s'en écarter. */
        font-size: calc(clamp(1.8rem, 6vw, 7rem) * var(--pc-font-scale) * var(--text-scale, 1));
    }

    .text-stage.align-left   .text-content { text-align: left; }
    .text-stage.align-center .text-content { text-align: center; }
    .text-stage.align-right  .text-content { text-align: right; }

    /* Découpage par lettre — nécessaire à `typewriter`, `cascade` et `wave`,
       inutile ailleurs (voir `needsChars` dans le script). `pre` conserve les
       espaces, qui deviennent des spans comme les autres. */
    .text-char {
        display: inline-block;
        white-space: pre;
    }

    /* --- Animations d'entrée (classe `anim-*` sur .text-line) ------------------
       Reprises de banner.html : mêmes courbes, pour que les deux overlays se
       ressemblent. La durée vient de `--text-anim-ms` au lieu d'être figée. */
    .text-line.anim-fade  { animation: text-fade  var(--text-anim-ms, 800ms) ease-out both; }
    .text-line.anim-slide { animation: text-slide var(--text-anim-ms, 800ms) cubic-bezier(0.22, 1, 0.36, 1) both; }
    .text-line.anim-zoom  { animation: text-zoom  var(--text-anim-ms, 800ms) cubic-bezier(0.22, 1, 0.36, 1) both; }
    .text-line.anim-flip  { animation: text-flip  var(--text-anim-ms, 800ms) cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes text-fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes text-slide { from { opacity: 0; transform: translateX(60%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes text-zoom  { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes text-flip  { from { opacity: 0; transform: perspective(1200px) rotateX(90deg); } to { opacity: 1; transform: perspective(1200px) rotateX(0); } }

    /* Entrées « avec ressort ». Les trois dépassent leur état final avant de s'y
       caler : `bounce` par l'échelle, `drop` et `swing` par la position. Le
       dépassement est écrit dans les keyframes plutôt que confié à une courbe
       élastique — une durée réglable de 50 ms à 20 s garde ainsi le même geste. */
    .text-line.anim-bounce { animation: text-bounce var(--text-anim-ms, 800ms) cubic-bezier(0.22, 1, 0.36, 1) both; }
    .text-line.anim-drop   { animation: text-drop   var(--text-anim-ms, 800ms) cubic-bezier(0.3, 0.8, 0.4, 1) both; }
    .text-line.anim-blur   { animation: text-blur   var(--text-anim-ms, 800ms) ease-out both; }

    /* Le pivot part du bord supérieur : posé au centre, le balancement ressemble
       à une simple rotation au lieu d'une pancarte qu'on lâche. */
    .text-line.anim-swing {
        transform-origin: top center;
        animation: text-swing var(--text-anim-ms, 800ms) cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes text-bounce {
        0%   { opacity: 0; transform: scale(0.4); }
        45%  { opacity: 1; transform: scale(1.1); }
        70%  { transform: scale(0.94); }
        86%  { transform: scale(1.03); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes text-drop {
        0%   { opacity: 0; transform: translateY(-140%); }
        55%  { opacity: 1; transform: translateY(0); }
        72%  { transform: translateY(-18%); }
        88%  { transform: translateY(0); }
        94%  { transform: translateY(-6%); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes text-swing {
        0%   { opacity: 0; transform: rotate(-14deg) translateY(-45%); }
        55%  { opacity: 1; transform: rotate(7deg) translateY(0); }
        78%  { transform: rotate(-3deg); }
        92%  { transform: rotate(1.2deg); }
        100% { opacity: 1; transform: rotate(0); }
    }

    /* `blur()` en `em` : le flou suit l'échelle du texte, là où une valeur en px
       serait imperceptible sur un titre et illisible sur une ligne fine. */
    @keyframes text-blur {
        from { opacity: 0; filter: blur(0.28em); transform: scale(1.06); }
        to   { opacity: 1; filter: blur(0);      transform: scale(1); }
    }

    /* Machine à écrire : chaque lettre bascule à son tour, l'ensemble tenant dans
       `--text-anim-ms`. Le pas est calculé en CSS (`/ var(--char-count)`) plutôt
       qu'écrit lettre par lettre en JS — un seul style inline suffit alors. */
    .text-line.anim-typewriter .text-char {
        opacity: 0;
        animation: text-fade 1ms linear both;
        animation-delay: calc(var(--char-index) * (var(--text-anim-ms, 800ms) / var(--char-count, 1)));
    }

    /* Cascade : même dévoilement lettre à lettre, mais chacune est animée au lieu
       d'apparaître d'un coup. La durée d'une lettre et le pas valent chacun la
       moitié de `--text-anim-ms` : la dernière démarre à mi-parcours et finit
       avec le total, comme le typewriter — ce que suppose le minuteur qui lance
       l'effet continu (cf. script). */
    .text-line.anim-cascade .text-char {
        opacity: 0;
        animation: text-cascade calc(var(--text-anim-ms, 800ms) / 2) cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: calc(var(--char-index) * (var(--text-anim-ms, 800ms) / var(--char-count, 1) / 2));
    }

    @keyframes text-cascade {
        from { opacity: 0; transform: translateY(0.6em) scale(0.85); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .text-cursor {
        display: inline-block;
        width: 0.08em;
        margin-left: 0.06em;
        background: currentColor;
        /* `currentColor` suit `--text-color`, mais pas un texte en dégradé (qui
           est transparent) : le curseur y reprend l'accent du thème. */
        align-self: stretch;
        animation: text-caret 1s steps(1, end) infinite;
    }

    .fx-gradient + .text-cursor,
    .fx-rainbow + .text-cursor { background: var(--pc-accent); }

    @keyframes text-caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    /* --- Effets continus (classe `fx-*` sur .text-content) --------------------
       Posés APRÈS la fin de l'entrée (cf. script) : les deux animent la même
       propriété `transform` et l'effet, en boucle, l'emporterait sur l'entrée. */
    .text-content.fx-pulse { animation: text-pulse var(--text-effect-ms, 2000ms) ease-in-out infinite; }

    @keyframes text-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.06); opacity: 0.82; }
    }

    /* Vague : les lettres montent l'une après l'autre. Le décalage se propage sur
       ~18 lettres, ce qui garde une onde visible aussi bien sur un mot court que
       sur une phrase. */
    .text-content.fx-wave .text-char {
        animation: text-wave var(--text-effect-ms, 2000ms) ease-in-out infinite;
        animation-delay: calc(var(--char-index) * (var(--text-effect-ms, 2000ms) / 18));
    }

    @keyframes text-wave {
        0%, 60%, 100% { transform: translateY(0); }
        30%           { transform: translateY(-0.22em); }
    }

    .text-content.fx-gradient {
        background: var(--pc-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        animation: text-gradient var(--text-effect-ms, 2000ms) ease infinite;
    }

    @keyframes text-gradient {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Défilement : `min-width: 100%` est indispensable. Sans lui, `translateX(100%)`
       vaut la largeur du *texte* — un texte court démarrerait déjà dans le cadre au
       lieu d'entrer par la droite. */
    .text-content.fx-marquee {
        display: inline-block;
        min-width: 100%;
        white-space: nowrap;
        animation: text-marquee var(--text-effect-ms, 2000ms) linear infinite;
    }

    @keyframes text-marquee {
        from { transform: translateX(100%); }
        to   { transform: translateX(-100%); }
    }

    /* Glitch : deux copies décalées en cyan/magenta, tirées de `data-text` via
       `attr()`. Le contenu passe donc par un attribut, jamais par du HTML
       concaténé — un texte saisi librement ne peut rien injecter. */
    .text-content.fx-glitch {
        position: relative;
        animation: text-glitch-base var(--text-effect-ms, 2000ms) steps(1, end) infinite;
    }

    .text-content.fx-glitch::before,
    .text-content.fx-glitch::after {
        content: attr(data-text);
        position: absolute;
        inset: 0;
        pointer-events: none;
        text-shadow: none;
    }

    .text-content.fx-glitch::before {
        color: #00e5ff;
        animation: text-glitch-a var(--text-effect-ms, 2000ms) steps(1, end) infinite;
    }

    .text-content.fx-glitch::after {
        color: #ff00d4;
        animation: text-glitch-b var(--text-effect-ms, 2000ms) steps(1, end) infinite;
    }

    @keyframes text-glitch-base {
        0%, 88%, 100% { transform: translate(0); }
        90%           { transform: translate(-0.02em, 0.01em); }
        94%           { transform: translate(0.02em, -0.01em); }
    }

    @keyframes text-glitch-a {
        0%, 86%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0); }
        88%           { clip-path: inset(6% 0 62% 0); transform: translate(-0.04em, 0); }
        92%           { clip-path: inset(48% 0 22% 0); transform: translate(0.03em, 0); }
    }

    @keyframes text-glitch-b {
        0%, 86%, 100% { clip-path: inset(100% 0 0 0); transform: translate(0); }
        90%           { clip-path: inset(28% 0 44% 0); transform: translate(0.04em, 0); }
        96%           { clip-path: inset(70% 0 8% 0);  transform: translate(-0.03em, 0); }
    }

    /* Les trois effets de mouvement. Amplitudes en `em` pour suivre l'échelle du
       texte, et volontairement basses : une incrustation qui bouge trop attire
       l'œil au détriment de la scène. */
    .text-content.fx-float { animation: text-float var(--text-effect-ms, 2000ms) ease-in-out infinite; }
    .text-content.fx-tilt  { animation: text-tilt  var(--text-effect-ms, 2000ms) ease-in-out infinite; }
    .text-content.fx-shake { animation: text-shake var(--text-effect-ms, 2000ms) linear infinite; }

    @keyframes text-float {
        0%, 100% { transform: translateY(-0.1em); }
        50%      { transform: translateY(0.1em); }
    }

    @keyframes text-tilt {
        0%, 100% { transform: rotate(-2.4deg); }
        50%      { transform: rotate(2.4deg); }
    }

    @keyframes text-shake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        20%      { transform: translate(-0.03em, 0.02em) rotate(-0.6deg); }
        40%      { transform: translate(0.035em, -0.025em) rotate(0.7deg); }
        60%      { transform: translate(-0.025em, -0.03em) rotate(-0.45deg); }
        80%      { transform: translate(0.03em, 0.03em) rotate(0.5deg); }
    }

    /* Néon : le halo remplace `--pc-shadow` le temps de l'effet — deux `text-shadow`
       ne se cumulent pas, c'est l'animation qui l'emporte. Les teintes viennent du
       thème, l'effet suit donc l'habillage choisi dans /settings. */
    .text-content.fx-neon { animation: text-neon var(--text-effect-ms, 2000ms) ease-in-out infinite; }

    @keyframes text-neon {
        0%, 100% { text-shadow: 0 0 0.06em var(--pc-accent), 0 0 0.24em var(--pc-accent); }
        50%      { text-shadow: 0 0 0.14em var(--pc-accent), 0 0 0.6em var(--pc-accent), 0 0 1.1em var(--pc-accent-2, var(--pc-accent)); }
    }

    /* Arc-en-ciel : même mécanique que `fx-gradient` (dégradé découpé sur le
       texte), mais avec ses propres teintes plutôt que celles du thème. Un
       `hue-rotate()` serait plus court et sans effet — il ne fait rien sur un
       texte blanc, qui est le défaut. */
    .text-content.fx-rainbow {
        background: linear-gradient(90deg,
            #ff4d4d, #ff9a2e, #ffe14d, #4dff88, #35d9ff, #6a7bff, #d24dff, #ff4d4d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        animation: text-rainbow var(--text-effect-ms, 2000ms) linear infinite;
    }

    /* Défile toujours dans le même sens (pas d'aller-retour comme `fx-gradient`) :
       le dégradé boucle sur la même teinte aux deux bouts, la reprise est donc
       invisible. */
    @keyframes text-rainbow {
        from { background-position: 0% 50%; }
        to   { background-position: -200% 50%; }
    }

    /* Une source OBS ne clignote jamais malgré la préférence système, mais un
       aperçu ouvert dans le navigateur du streamer, si. */
    @media (prefers-reduced-motion: reduce) {
        .text-line,
        .text-content,
        .text-char,
        .text-cursor,
        .text-content::before,
        .text-content::after {
            animation: none !important;
            opacity: 1 !important;
        }
    }
</style>

<script>
    /**
     * Rendu d'une section de texte dans `root`.
     *
     * Le contrat tient en deux points :
     *
     *  - `render(section)` est idempotent. Tant que l'empreinte de la section ne
     *    change pas, le DOM n'est pas touché — le WebSocket pousse la config
     *    entière chaque seconde, reconstruire à chaque passage relancerait le
     *    typewriter en plein direct. Même idée que `rotationSignature()` dans
     *    banner.html.
     *  - L'effet continu ne démarre qu'une fois l'entrée terminée. Les deux
     *    animent `transform` sur des nœuds imbriqués et, surtout, un `wave` posé
     *    d'emblée écraserait le dévoilement lettre à lettre du typewriter.
     */
    function createTextRenderer(root) {
        const ENTRANCES = ['fade', 'slide', 'zoom', 'flip', 'bounce', 'drop', 'swing', 'blur', 'typewriter', 'cascade'];
        const EFFECTS = ['marquee', 'pulse', 'wave', 'glitch', 'gradient', 'float', 'tilt', 'shake', 'neon', 'rainbow'];
        const ALIGNS = ['left', 'center', 'right'];
        const VALIGNS = ['top', 'middle', 'bottom'];

        /** Animations qui adressent chaque lettre séparément — les seules à imposer
         *  le découpage en spans. Partout ailleurs un nœud texte simple suffit, et
         *  se coupe correctement en fin de ligne. */
        const PER_CHAR_ENTRANCES = ['typewriter', 'cascade'];
        const PER_CHAR_EFFECTS = ['wave'];

        function needsChars(animation, effect) {
            return PER_CHAR_ENTRANCES.includes(animation) || PER_CHAR_EFFECTS.includes(effect);
        }

        /** Champs qui changent le rendu. Un champ absent d'ici ne provoque pas de
         *  reconstruction : `label` et `order` ne se voient pas dans l'overlay. */
        function sectionSignature(section) {
            if (!section) return '';
            return [
                section.content,
                section.animation,
                section.effect,
                section.animationMs,
                section.effectMs,
                section.scale,
                section.color,
                section.align,
                section.verticalAlign,
                section.backgroundColor,
            ].join('␀');
        }

        function oneOf(value, allowed, fallback) {
            return allowed.includes(value) ? value : fallback;
        }

        function positiveMs(value, fallback) {
            const n = Number(value);
            return Number.isFinite(n) && n > 0 ? n : fallback;
        }

        let signature = null;
        let effectTimer = null;

        /** Remplit `el` avec un span par caractère, indexé pour les délais CSS. */
        function fillChars(el, content) {
            const chars = Array.from(content);
            for (const [i, char] of chars.entries()) {
                const span = document.createElement('span');
                span.className = 'text-char';
                span.style.setProperty('--char-index', String(i));
                // textContent, jamais innerHTML : le contenu vient d'un champ libre.
                span.textContent = char;
                el.appendChild(span);
            }
            el.style.setProperty('--char-count', String(chars.length || 1));
        }

        function build(section) {
            const animation = oneOf(section.animation, ENTRANCES, 'none');
            const effect = oneOf(section.effect, EFFECTS, 'none');
            const animMs = positiveMs(section.animationMs, 800);
            const effectMs = positiveMs(section.effectMs, 2000);
            const content = typeof section.content === 'string' ? section.content : '';

            const stage = document.createElement('div');
            stage.className = [
                'text-stage',
                'align-' + oneOf(section.align, ALIGNS, 'center'),
                'valign-' + oneOf(section.verticalAlign, VALIGNS, 'middle'),
                effect === 'marquee' ? 'has-marquee' : '',
            ].filter(Boolean).join(' ');

            const scale = Number(section.scale);
            stage.style.setProperty('--text-scale', Number.isFinite(scale) && scale > 0 ? String(scale) : '1');
            stage.style.setProperty('--text-anim-ms', animMs + 'ms');
            stage.style.setProperty('--text-effect-ms', effectMs + 'ms');
            if (section.color) stage.style.setProperty('--text-color', section.color);
            if (section.backgroundColor) stage.style.setProperty('--text-bg', section.backgroundColor);

            const block = document.createElement('div');
            block.className = 'text-block';

            const line = document.createElement('div');
            line.className = 'text-line' + (animation === 'none' ? '' : ' anim-' + animation);

            const el = document.createElement('span');
            el.className = 'text-content';
            // `data-text` alimente les deux copies du glitch (content: attr(...)).
            el.setAttribute('data-text', content);

            if (needsChars(animation, effect)) {
                fillChars(el, content);
            } else {
                el.textContent = content;
            }

            line.appendChild(el);

            if (animation === 'typewriter') {
                const cursor = document.createElement('span');
                cursor.className = 'text-cursor';
                line.appendChild(cursor);
            }

            block.appendChild(line);
            stage.appendChild(block);

            return { stage, line, el, animation, effect, animMs };
        }

        return {
            root,

            /**
             * Affiche `section`, ou vide le conteneur si elle est absente.
             * Ne reconstruit que si l'empreinte a changé.
             */
            render(section) {
                const next = sectionSignature(section);
                if (next === signature) return false;
                signature = next;

                if (effectTimer !== null) {
                    clearTimeout(effectTimer);
                    effectTimer = null;
                }
                root.textContent = '';

                if (!section) return true;

                const built = build(section);
                root.appendChild(built.stage);

                if (built.effect !== 'none') {
                    // Retirer la classe d'entrée avant de poser l'effet : les
                    // règles `.anim-typewriter .text-char` et `.fx-wave .text-char`
                    // ont la même spécificité, celle qui reste gagnerait par ordre
                    // de déclaration et non par intention.
                    const start = () => {
                        built.line.classList.remove('anim-' + built.animation);
                        built.el.classList.add('fx-' + built.effect);
                        effectTimer = null;
                    };
                    if (built.animation === 'none') start();
                    else effectTimer = setTimeout(start, built.animMs);
                }

                return true;
            },

            /** Vide le conteneur et oublie l'empreinte (le prochain `render` reconstruit). */
            clear() {
                if (effectTimer !== null) {
                    clearTimeout(effectTimer);
                    effectTimer = null;
                }
                signature = null;
                root.textContent = '';
            },

            /** Exposée pour les tests : l'empreinte est le cœur du « ne pas rejouer ». */
            signatureOf: sectionSignature,
        };
    }
</script>
