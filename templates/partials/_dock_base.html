/* Style commun des pages pensées pour un dock OBS (Docks → Docks de navigateur
   personnalisés) : /music-config et /followers-info. À inclure DANS la balise
   <style> de la page, comme partials/_header.html.

   Palette sombre fixe plutôt que le thème des overlays : un dock se lit à côté de
   l'interface d'OBS, pas par-dessus le stream. */
:root {
    --bg: #16161e;
    --panel: #1f2335;
    --panel-2: #262b40;
    --border: #33395a;
    --text: #e6e9f5;
    --muted: #a3abcf;
    --accent: #7aa2f7;
    --on: #9ece6a;
    --warn: #e0af68;
    --danger: #f7768e;
    --radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.35 "Instrument Sans", system-ui, sans-serif;
}

.dock {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 760px;
    margin: 0 auto;
    padding: 8px;
}

.btn {
    border: 1px solid transparent;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}

.btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
}

.panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
}

.panel-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
}

.hint {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
}
