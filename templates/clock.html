<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Horloge en direct</title>
    <!-- Thème commun : police, couleurs et rayons viennent de /settings. -->
    <link id="pc-theme" rel="stylesheet" href="/theme.css">
    <script src="/public/js/theme-live.js" defer></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            /* Fond opaque assumé : cet overlay est prévu pour être utilisé en
               plein écran, pas incrusté sur la vidéo. */
            background-color: black;
            color: var(--pc-text);
            font-family: var(--pc-font);
            padding-left: 2rem;
        }
        h1 {
            font-size: calc(2.5em * var(--pc-font-scale));
            text-align: center;
            font-family: var(--pc-font);
            color: var(--pc-text);
        }
        @media (max-width: 768px) {
            h1 {
                font-size: medium;
                font-family: Arial, Helvetica, sans-serif;
            }
        }
    </style>
</head>
<body>
    <h1 id="clock"></h1>
    <script>
        const format = {
            hour: {% if format_hour %}true{% else %}false{% endif %},
            minute: {% if format_minute %}true{% else %}false{% endif %},
            second: {% if format_second %}true{% else %}false{% endif %}
        };

        function updateClock() {
            const now = new Date();
            const options = {};

            if (format.hour) options.hour = '2-digit';
            if (format.minute) options.minute = '2-digit';
            if (format.second) options.second = '2-digit';

            document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', options);
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
