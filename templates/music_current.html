<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Music Current</title>
    <!-- Thème commun : police, couleurs et rayons viennent de /settings. -->
    <link id="pc-theme" rel="stylesheet" href="/theme.css">
    <script src="/public/js/theme-live.js" defer></script>
    <style>
        /* --- Taille de référence ------------------------------------------------
           Tout se règle sur `--size`, la hauteur du titre. Elle vaut 2,5 rem — le
           rendu historique — dès que la source est assez haute, et rétrécit avec
           elle en dessous : une source en bandeau (600×80) reste lisible au lieu
           de rogner le titre. La barre de progression prend de la place, d'où une
           borne plus basse quand elle est affichée. */
        :root {
            --size: calc(min(2.5rem, 70vh) * var(--pc-font-scale));
        }

        body.has-progress {
            --size: calc(min(2.5rem, 38vh) * var(--pc-font-scale));
        }

        body {
            margin: 0;
            padding: 0 0 0 min(2rem, 4vw);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            /* Fond opaque assumé : overlay prévu pour le plein écran. */
            background-color: black;
            color: var(--pc-text);
            font-family: var(--pc-font);
            gap: calc(var(--size) * 0.3);
        }

        h1 {
            font-size: var(--size);
            text-align: left;
            font-family: var(--pc-font);
            margin: 0;
            opacity: 0;
            min-width: 10px;
        }

        /* Titre et barre de progression empilés : la barre prend la largeur du
           titre, avec un minimum pour qu'un titre court garde une barre lisible. */
        .track {
            display: flex;
            flex-direction: column;
            gap: calc(var(--size) * 0.24);
            min-width: 0;
        }

        /* Dimensions en fractions de `--size` : identiques à l'ancien rendu à la
           taille pleine (7,2 × 40 px = 288 px), proportionnées en dessous. */
        .progress {
            display: flex;
            flex-direction: column;
            gap: calc(var(--size) * 0.14);
            min-width: min(calc(var(--size) * 7.2), 80vw);
            font-size: calc(var(--size) * 0.4);
        }

        /* `display: flex` l'emporterait sur l'attribut `hidden` sans cette règle. */
        .progress[hidden] {
            display: none;
        }

        .progress-bar {
            position: relative;
            height: calc(var(--size) * 0.16);
            border-radius: var(--pc-radius-sm);
            overflow: hidden;
        }

        /* Rail en couleur de texte atténuée : `--pc-panel` est presque noir, donc
           invisible sur le fond de cet overlay. */
        .progress-bar::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--pc-text);
            opacity: 0.18;
        }

        .progress-fill {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, var(--pc-accent), var(--pc-accent-2));
            transform-origin: left center;
            transform: scaleX(0);
        }

        .progress-times {
            display: flex;
            justify-content: space-between;
            color: var(--pc-text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* Animations */
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes slideOut {
            0% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-20px);
                filter: blur(5px);
            }
        }

        .music-title {
            animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
            animation-fill-mode: forwards;
        }

        .music-title.slide-in {
            animation-name: slideIn;
            animation-duration: 0.8s;
        }

        .music-title.slide-out {
            animation-name: slideOut;
            animation-duration: 0.5s;
        }

        .music-icon {
            font-size: var(--size);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            opacity: 0;
            min-width: 10px;
        }

        .cover-art {
            width: 1em;
            height: 1em;
            border-radius: var(--pc-radius-sm);
            object-fit: cover;
            display: block;
        }

        /* Bandeau très bas : les temps ne tiendraient pas sous la barre. */
        @media (max-height: 90px) {
            .progress-times { display: none; }
        }

        /* --- Source verticale -----------------------------------------------
           Plus haute que large (colonne à côté de la caméra, format portrait) :
           grande pochette au-dessus, titre centré dessous, barre pleine largeur. */
        @media (orientation: portrait) {
            :root, body.has-progress {
                --size: calc(min(8vw, 5vh) * var(--pc-font-scale));
                --cover: min(76vw, 55vh);
            }

            body {
                flex-direction: column;
                justify-content: center;
                padding: 6vw;
                gap: calc(var(--size) * 0.8);
            }

            .music-icon {
                /* L'emoji de repli et la pochette prennent la taille de la pochette. */
                font-size: var(--cover);
            }

            .cover-art {
                border-radius: var(--pc-radius);
                box-shadow: var(--pc-shadow);
            }

            .track {
                align-items: center;
                width: var(--cover);
                max-width: 100%;
            }

            h1 {
                text-align: center;
                overflow-wrap: anywhere;
                text-wrap: balance;
            }

            .progress {
                width: 100%;
                min-width: 0;
            }
        }

        /* --- Pochette qui tourne (?spin dans l'URL) --------------------------
           Ronde comme un disque, elle tourne pendant la lecture et s'arrête en
           pause. */
        body.spin .cover-art {
            border-radius: 50%;
            animation: disc-spin 12s linear infinite;
        }

        body.spin.is-paused .cover-art {
            animation-play-state: paused;
        }

        @keyframes disc-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            body.spin .cover-art { animation: none; }
        }
    </style>
</head>
<body>
    <div id="iconWrapper" class="music-icon music-title"></div>
    <div class="track">
        <h1 id="musicTitle" class="music-title"></h1>
        <!-- Activée depuis /music-config ; masquée tant que la durée est inconnue. -->
        <div id="progress" class="progress" hidden>
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <div class="progress-times">
                <span id="progressElapsed">0:00</span>
                <span id="progressTotal">0:00</span>
            </div>
        </div>
    </div>

    <script>
        const MUSIC_PORT = {{ music_port }};

        let currentMusic = "";
        let currentCoverArt = null;
        let displayedMusic = "";
        let ws = null;
        let reconnectTimeout = null;
        let isAnimating = false;
        const titleElement = document.getElementById('musicTitle');
        const iconWrapper = document.getElementById('iconWrapper');
        const progressEl = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressElapsed = document.getElementById('progressElapsed');
        const progressTotal = document.getElementById('progressTotal');

        // Position extrapolée ici : JanusCore n'envoie une ancre qu'aux changements
        // d'état (piste, pause, reprise), pas à chaque seconde.
        // { positionMs, at, paused, durationMs } — `at` en temps de performance.now().
        let progressAnchor = null;
        let shownSecond = -1;

        /** 65000 → "1:05" ; au-delà d'une heure, "1:02:05". */
        function formatTime(ms) {
            const total = Math.max(0, Math.floor(ms / 1000));
            const s = String(total % 60).padStart(2, "0");
            const minutes = Math.floor(total / 60);
            if (minutes < 60) return `${minutes}:${s}`;
            return `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, "0")}:${s}`;
        }

        /** Position à l'instant `now`, bornée à la durée de la piste. */
        function progressAt(anchor, now) {
            const elapsed = anchor.paused ? 0 : now - anchor.at;
            return Math.min(Math.max(anchor.positionMs + elapsed, 0), anchor.durationMs);
        }

        /** Prend une nouvelle ancre, ou masque la barre si elle n'a rien à montrer. */
        function applyProgress(data, now) {
            const durationMs = data?.metadata?.duration_ms;
            const show = data?.progress_bar_enabled === true
                && data?.has_sink === true
                && typeof durationMs === "number" && durationMs > 0
                && typeof data?.position_ms === "number";

            progressEl.hidden = !show;
            // La barre prend de la hauteur : le CSS réduit alors le titre sur une
            // source basse (cf. `body.has-progress`). La pause arrête la pochette
            // qui tourne (?spin).
            document.body?.classList.toggle('has-progress', show);
            document.body?.classList.toggle('is-paused', data?.paused === true);
            if (!show) {
                progressAnchor = null;
                return;
            }

            progressAnchor = { positionMs: data.position_ms, at: now, paused: data.paused === true, durationMs };
            progressTotal.textContent = formatTime(durationMs);
            shownSecond = -1;
            renderProgress(now);
        }

        function renderProgress(now) {
            if (!progressAnchor) return;
            const position = progressAt(progressAnchor, now);
            // `transform` plutôt que `width` : animé par le compositeur, sans relayout.
            progressFill.style.transform = `scaleX(${position / progressAnchor.durationMs})`;
            const second = Math.floor(position / 1000);
            if (second !== shownSecond) {
                shownSecond = second;
                progressElapsed.textContent = formatTime(position);
            }
        }

        function tick() {
            renderProgress(performance.now());
            requestAnimationFrame(tick);
        }

        async function updateMusic(newTitle, coverArt) {
            if (newTitle === displayedMusic && coverArt === currentCoverArt && displayedMusic !== "") return;

            if (displayedMusic && titleElement) {
                isAnimating = true;
                titleElement.classList.remove("slide-in");
                titleElement.classList.add("slide-out");
                iconWrapper.classList.remove("slide-in");
                iconWrapper.classList.add("slide-out");

                await new Promise(r => setTimeout(r, 500));
            }

            displayedMusic = newTitle;
            currentCoverArt = coverArt;

            if (displayedMusic && titleElement) {
                if (coverArt) {
                    // Construction par API DOM, jamais par concaténation : `coverArt` est
                    // une URL data: bâtie à partir du tag du fichier audio, donc d'une
                    // source non maîtrisée. Affecté par propriété, un guillemet dans la
                    // valeur ne peut pas sortir de l'attribut — c'est exactement le motif
                    // corrigé dans chat-common.js.
                    const img = document.createElement("img");
                    img.className = "cover-art";
                    img.src = coverArt;
                    img.alt = "";
                    iconWrapper.replaceChildren(img);
                } else {
                    iconWrapper.textContent = "🎶";
                }

                titleElement.textContent = displayedMusic;
                titleElement.classList.remove("slide-out");
                iconWrapper.classList.remove("slide-out");
                void titleElement.offsetWidth;
                titleElement.classList.add("slide-in");
                iconWrapper.classList.add("slide-in");
            } else {
                if (titleElement) {
                    titleElement.textContent = "";
                    titleElement.classList.remove("slide-out", "slide-in");
                }
                iconWrapper.replaceChildren();
                iconWrapper.classList.remove("slide-out", "slide-in");
            }

            isAnimating = false;
        }

        function handleMessage(data) {
            const current = data?.current_music ?? "";
            const coverArt = data?.metadata?.cover_art ?? null;
            const newMusicTitle = current ? current.split(".")[0] : "";

            if (newMusicTitle !== currentMusic || coverArt !== currentCoverArt) {
                currentMusic = newMusicTitle;
                updateMusic(newMusicTitle, coverArt);
            }
            applyProgress(data, performance.now());
        }

        function initSocket() {
            const host = window.location.hostname || "localhost";
            const wsUrl = `ws://${host}:${MUSIC_PORT}/api/current_music_ws`;

            try {
                ws = new WebSocket(wsUrl);
            } catch (e) {
                console.error("Impossible d'ouvrir le WebSocket:", e);
                reconnectTimeout = setTimeout(initSocket, 5000);
                return;
            }

            ws.addEventListener("open", () => {
                console.log("Connected to music WS:", wsUrl);
            });

            ws.addEventListener("message", (evt) => {
                let data;
                try {
                    data = JSON.parse(evt.data);
                } catch (e) {
                    return;
                }
                handleMessage(data);
            });

            ws.addEventListener("close", () => {
                reconnectTimeout = setTimeout(initSocket, 5000);
            });

            ws.addEventListener("error", () => {
                try {
                    ws?.close();
                } catch (e) {
                    console.error("Error closing WebSocket:", e);
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', () => {
            // `/music-current?spin` : pochette ronde qui tourne pendant la lecture.
            if (new URLSearchParams(location.search).has('spin')) {
                document.body.classList.add('spin');
            }
            initSocket();
            requestAnimationFrame(tick);
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (reconnectTimeout) clearTimeout(reconnectTimeout);
        });
    </script>
</body>
</html>
