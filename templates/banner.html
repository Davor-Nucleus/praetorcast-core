<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Banner</title>
    <!-- Thème commun : police, couleurs et rayons viennent de /settings. -->
    <link id="pc-theme" rel="stylesheet" href="/theme.css">
    <script src="/public/js/theme-live.js" defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            /* Bannière plein écran : fond opaque assumé. */
            background-color: black;
            color: var(--pc-text);
            font-family: var(--pc-font);
            overflow: hidden;
        }

        /* Conteneur plein écran de la bannière */
        .banner-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Hauteur réellement occupée par les barres d'objectif en mode
               « barres fixes ». Mesurée par le JS, elle rétrécit la zone des
               cartes pour qu'aucune ne passe dessous. */
            --goal-dock-h: 0px;
        }

        /* Une carte occupe tout l'écran et centre son contenu. */
        .card-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 4vw, 4rem);
            opacity: 0;
        }

        /* Le dock est ancré sur un bord : les cartes s'arrêtent à sa limite. */
        .banner-overlay.dock-bottom .card-wrapper { bottom: var(--goal-dock-h); }
        .banner-overlay.dock-top    .card-wrapper { top:    var(--goal-dock-h); }

        .card-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: clamp(1rem, 3vw, 3rem);
            width: min(92vw, 1600px);
            max-width: 100%;
        }

        /* Section image */
        .image-section {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-image {
            height: clamp(140px, 28vmin, 420px);
            width: auto;
            max-width: min(42vw, 520px);
            object-fit: contain;
            border-radius: var(--pc-radius);
        }

        /* Section texte */
        .text-section {
            display: flex;
            align-items: center;
            justify-content: start;
            min-width: 0;
            padding: clamp(0.5rem, 2vw, 1.5rem);
        }

        .text-section.has-image {
            flex: 1 1 360px;
        }

        .text-section.full-width {
            flex: 1 1 100%;
            width: 100%;
        }

        /* La taille suit le viewport (clamp) au lieu d'un em fixe : le texte reste
           proportionné, qu'on soit sur une petite ou une très grande fenêtre. */
        .banner-text {
            margin: 0;
            font-weight: bold;
            line-height: 1.05;
            text-align: left;
            overflow-wrap: break-word;
            word-break: break-word;
            text-wrap: balance;
        }

        .text-section.full-width .banner-text {
            font-size: clamp(2.5rem, 9vw, 9rem);
        }

        .text-section.has-image .banner-text {
            font-size: clamp(2rem, 6vw, 6.5rem);
        }

        /* Placeholder transparent émis par le JS quand il n'y a pas d'image. */
        .bg-fill { display: none; }

        /* --- Barres d'objectif (cf. partials/_goal_bars.html) ----------------
           Deux enveloppes pour le même composant : ancrée sur un bord en mode
           « barres fixes », ou posée dans une carte en mode « carte dédiée ». */
        .goal-dock {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            padding: clamp(1rem, 2.5vw, 2.5rem) clamp(1.5rem, 4vw, 4rem);
            font-family: var(--pc-font);
            color: var(--pc-text);
            /* Le dock ne doit jamais intercepter un clic dans OBS. */
            pointer-events: none;
        }

        .goal-dock.dock-bottom { bottom: 0; }
        .goal-dock.dock-top    { top: 0; }
        .goal-dock.hide        { display: none; }

        /* En carte, le dock n'est plus ancré : il occupe la largeur du conteneur
           et se laisse animer par la transition de la carte qui le porte.
           Aucune échelle imposée : les `clamp()` de l'habillage bannière sont déjà
           calibrés pour le plein écran. */
        .goal-dock-card {
            position: static;
            flex: 1 1 100%;
            gap: 2.4rem;
            padding: 0;
            /* Même largeur utile que `.card-container`, pour que les barres
               s'alignent sur le texte des cartes voisines. */
            max-width: min(92vw, 1600px);
        }

        /* Dégradé animé sur le texte */
        .gradient-text {
            background: var(--pc-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
        }

        .animate-gradient {
            animation: gradient 5s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Transitions (classes posées par le JS : <type>-in / <type>-out) --- */
        .card-wrapper.fade-in   { animation: fadeIn   0.8s ease-out both; }
        .card-wrapper.fade-out  { animation: fadeOut  0.5s ease-in  both; }
        .card-wrapper.slide-in  { animation: slideIn  0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .card-wrapper.slide-out { animation: slideOut 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .card-wrapper.zoom-in   { animation: zoomIn   0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .card-wrapper.zoom-out  { animation: zoomOut  0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .card-wrapper.flip-in   { animation: flipIn   0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .card-wrapper.flip-out  { animation: flipOut  0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

        @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

        @keyframes slideIn  { from { opacity: 0; transform: translateX(100%); }  to { opacity: 1; transform: translateX(0); } }
        @keyframes slideOut { from { opacity: 1; transform: translateX(0); }     to { opacity: 0; transform: translateX(-100%); } }

        @keyframes zoomIn  { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes zoomOut { from { opacity: 1; transform: scale(1); }    to { opacity: 0; transform: scale(1.08); } }

        @keyframes flipIn  { from { opacity: 0; transform: perspective(1200px) rotateX(90deg); }  to { opacity: 1; transform: perspective(1200px) rotateX(0); } }
        @keyframes flipOut { from { opacity: 1; transform: perspective(1200px) rotateX(0); }      to { opacity: 0; transform: perspective(1200px) rotateX(-90deg); } }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--pc-text-muted);
            font-family: monospace;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="banner-overlay" id="bannerOverlay">
        <div class="empty-state" id="emptyState">
            <p>No banner cards configured or loading...</p>
        </div>
        <div class="goal-dock goal-banner hide" id="goalDock"></div>
    </div>

    {% include "partials/_goal_bars.html" %}

    <script>
        const DEFAULT_DURATION_MS = 6000;

        const overlayEl   = document.getElementById('bannerOverlay');
        const emptyStateEl = document.getElementById('emptyState');
        const dockEl      = document.getElementById('goalDock');
        const dockBars    = createGoalBars(dockEl);

        // `scale: 1` = la taille prévue par l'habillage bannière, qui se calibre
        // seul sur le viewport ; le réglage ne sert qu'à s'en écarter.
        const DEFAULT_DOCK = { enabled: false, position: 'bottom', goalId: null, scale: 1 };

        /** Cartes de la rotation (texte/image ou objectif), poussées par /api/banner_ws. */
        let bannerCards = [];
        /** Barres fixes, même origine : c'est bien `/banner-config` qui les règle. */
        let dock = { ...DEFAULT_DOCK };
        /** Toutes les entrées d'objectif avec leurs valeurs, poussées par /api/goal_ws. */
        let goalEntries = [];

        /** Rotation effective : les cartes retenues, dans leur ordre. */
        let cards = [];
        let currentIndex = 0;
        let rotationTimer = null;
        let currentCardElement = null;
        let wsDeliveredOnce = false;
        let lastSignature = null;

        /**
         * Objectifs visés par une carte ou par les barres fixes.
         *
         * `goalId` absent vaut « tous les objectifs ». Un `goalId` qui ne
         * correspond à rien — l'objectif a été supprimé depuis — renvoie une liste
         * vide, ce que les appelants traitent comme « rien à afficher » plutôt que
         * de retomber silencieusement sur tous.
         */
        function entriesFor(goalId) {
            if (!goalId) return goalEntries;
            return goalEntries.filter((e) => e.config && e.config.id === goalId);
        }

        function dockScale() {
            const scale = Number(dock.scale);
            return Number.isFinite(scale) && scale > 0 ? scale : DEFAULT_DOCK.scale;
        }

        function clearRotation() {
            if (rotationTimer) {
                clearTimeout(rotationTimer);
                rotationTimer = null;
            }
        }

        // Rotation par setTimeout récursif : chaque carte reste affichée selon sa
        // propre durée (durationMs), avec repli sur DEFAULT_DURATION_MS.
        function scheduleNext() {
            clearRotation();
            if (cards.length <= 1) return;
            const duration = (cards[currentIndex] && cards[currentIndex].durationMs) || DEFAULT_DURATION_MS;
            rotationTimer = setTimeout(() => {
                const nextIndex = (currentIndex + 1) % cards.length;
                displayCard(nextIndex);
                scheduleNext();
            }, duration);
        }

        // ── Composition de la rotation ────────────────────────────────────────

        /**
         * Cartes réellement affichables.
         *
         * Une carte d'objectif dont la cible a été supprimée depuis `/goal-config`
         * est retirée du cycle : mieux vaut l'ignorer qu'imposer une carte vide
         * pendant six secondes à chaque tour.
         */
        function buildRotation() {
            return bannerCards.filter(
                (c) => c.kind !== 'goal' || entriesFor(c.goalId).length > 0
            );
        }

        /**
         * Empreinte de tout ce qui impose de **recomposer** la rotation.
         *
         * Volontairement aveugle aux valeurs (`current`, `percent`, `warning`) :
         * /api/goal_ws émet à chaque follower gagné, et reconstruire à ce
         * moment-là ferait sauter la carte affichée et redémarrer le cycle. Seuls
         * la structure des cartes, les réglages des barres fixes et la liste des
         * objectifs existants comptent ici ; les valeurs sont poussées dans les
         * barres déjà en place.
         */
        function rotationSignature() {
            const cardsPart = bannerCards.map((c) => [
                c.id || '', c.kind || 'text', c.goalId || '',
                c.text || '', c.imagePath || '', c.transition || '', c.durationMs || 0,
            ]);
            // Les identifiants seuls : c'est ce qui décide quelles cartes et quelles
            // barres fixes ont encore une cible.
            const goalsPart = goalEntries.map((e, i) => (e.config && e.config.id) || '#' + i);
            const dockPart = dock.enabled
                ? [dock.position || 'bottom', dock.goalId || '', dockScale()]
                : null;
            return JSON.stringify([cardsPart, dockPart, goalsPart]);
        }

        function rebuildRotation() {
            clearRotation();

            if (currentCardElement && currentCardElement.parentNode) {
                currentCardElement.parentNode.removeChild(currentCardElement);
            }
            currentCardElement = null;
            currentIndex = 0;
            cards = buildRotation();

            if (cards.length > 0) {
                displayCard(0);
                scheduleNext();
            }
        }

        // ── Barres d'objectif ─────────────────────────────────────────────────

        function dockEntries() {
            return dock.enabled ? entriesFor(dock.goalId) : [];
        }

        /** Les barres fixes ne s'affichent que s'il y a effectivement de quoi les emplir. */
        function dockVisible() {
            return dockEntries().length > 0;
        }

        function updateDock() {
            const visible = dockVisible();
            dockEl.classList.toggle('hide', !visible);

            const atTop = dock.position === 'top';
            dockEl.classList.toggle('dock-top', visible && atTop);
            dockEl.classList.toggle('dock-bottom', visible && !atTop);
            overlayEl.classList.toggle('dock-top', visible && atTop);
            overlayEl.classList.toggle('dock-bottom', visible && !atTop);

            if (visible) {
                dockEl.style.setProperty('--goal-scale', dockScale());
                dockBars.render(dockEntries());
            } else {
                // Vider plutôt que laisser des barres dans un dock masqué : elles
                // réapparaîtraient telles quelles, valeurs périmées comprises, si
                // les barres fixes étaient réactivées.
                dockBars.render([]);
            }
            syncDockHeight();
        }

        // La hauteur du dock dépend du nombre de barres, de l'échelle et de la
        // police : la mesurer est plus sûr que de la calculer.
        function syncDockHeight() {
            const height = dockVisible() ? dockEl.getBoundingClientRect().height : 0;
            overlayEl.style.setProperty('--goal-dock-h', height + 'px');
        }

        if (typeof ResizeObserver === 'function') {
            new ResizeObserver(syncDockHeight).observe(dockEl);
        }

        /** Rafraîchit les valeurs de la carte d'objectif, si c'est elle qui est affichée. */
        function updateCardBars() {
            if (currentCardElement && currentCardElement.goalBars) {
                currentCardElement.goalBars.render(entriesFor(currentCardElement.goalCardId));
            }
        }

        function updateEmptyState() {
            const somethingOnScreen = cards.length > 0 || dockVisible();
            emptyStateEl.style.display = somethingOnScreen ? 'none' : 'flex';
        }

        /** Point d'entrée unique des deux flux : recompose si besoin, sinon rafraîchit. */
        function applyAll() {
            const signature = rotationSignature();
            if (signature !== lastSignature) {
                lastSignature = signature;
                rebuildRotation();
            }
            updateDock();
            updateCardBars();
            updateEmptyState();
        }

        // ── Flux temps réel ───────────────────────────────────────────────────

        // Connexion WebSocket pour les mises à jour en direct (un « Save » dans le
        // configurateur se reflète sans rafraîchir la source OBS). Repli HTTP si la
        // WS n'aboutit pas, et reconnexion automatique en arrière-plan.
        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            let ws;
            try {
                ws = new WebSocket(`${proto}://${location.host}/api/banner_ws`);
            } catch (error) {
                loadConfigFallback();
                return;
            }

            ws.addEventListener('message', (event) => {
                wsDeliveredOnce = true;
                try {
                    applyBannerConfig(JSON.parse(event.data));
                    applyAll();
                } catch (error) {
                    console.error('Banner WS parse error:', error);
                }
            });

            ws.addEventListener('close', () => {
                if (!wsDeliveredOnce) {
                    loadConfigFallback();
                }
                setTimeout(connectWs, 2000);
            });
        }

        /** Normalise la charge utile de `/api/banner-config` (cartes + barres fixes). */
        function applyBannerConfig(payload) {
            const source = payload && typeof payload === 'object' ? payload : {};
            bannerCards = Array.isArray(source.cards) ? source.cards : [];
            dock = { ...DEFAULT_DOCK, ...(source.dock || {}) };
        }

        // Le même flux que l'overlay /goal, pour les valeurs des barres. Le choix de
        // ce que la bannière affiche, lui, vient de /api/banner_ws : /goal-config
        // définit les objectifs, /banner-config décide de leur place à l'écran.
        // Ouvert en permanence, pour qu'un changement prenne effet sans toucher à OBS.
        function connectGoalWs() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            let ws;
            try {
                ws = new WebSocket(`${proto}://${location.host}/api/goal_ws`);
            } catch (error) {
                setTimeout(connectGoalWs, 5000);
                return;
            }

            ws.addEventListener('message', (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    goalEntries = payload.goals || [];
                    applyAll();
                } catch (error) {
                    console.error('Goal WS parse error:', error);
                }
            });

            ws.addEventListener('close', () => setTimeout(connectGoalWs, 5000));
            ws.addEventListener('error', () => ws.close());
        }

        async function loadConfigFallback() {
            try {
                const response = await fetch('/api/banner-config');
                applyBannerConfig(response.ok ? await response.json() : null);
            } catch (error) {
                console.error('Error loading config:', error);
                applyBannerConfig(null);
            }
            applyAll();
        }

        // ── Rendu d'une carte ─────────────────────────────────────────────────

        function getTransitionClasses(type, isIn) {
            const base = type || 'fade';
            return isIn ? `${base}-in` : `${base}-out`;
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        /**
         * Carte d'objectif : bâtie par API DOM, jamais par concaténation.
         *
         * Chaque carte reçoit **son propre** jeu de barres. Les partager avec les
         * barres fixes ou avec la carte précédente les ferait migrer d'un parent à
         * l'autre, et l'ancienne carte se viderait en plein fondu de sortie.
         */
        function buildGoalCard(wrapper, card) {
            const container = document.createElement('div');
            container.className = 'card-container';

            const holder = document.createElement('div');
            holder.className = 'goal-dock goal-dock-card goal-banner';

            container.appendChild(holder);
            wrapper.appendChild(container);

            // Mémorisé sur l'élément : les rafraîchissements de valeur doivent
            // rejouer la même sélection, sans relire la carte de la rotation.
            wrapper.goalCardId = card.goalId || null;
            wrapper.goalBars = createGoalBars(holder);
            wrapper.goalBars.render(entriesFor(wrapper.goalCardId));
        }

        function buildTextCard(wrapper, card) {
            const hasImage = card.imagePath && card.imagePath.trim() !== '';

            wrapper.innerHTML = `
                <div class="card-container">
                    ${hasImage ? `
                        <div class="image-section">
                            <img src="${card.imagePath}" alt="Banner" class="banner-image" />
                        </div>
                    ` : ''}
                    <div class="text-section ${hasImage ? 'has-image' : 'full-width'}">
                        ${!hasImage ? '<div class="bg-fill"></div>' : ''}
                        <h2 class="banner-text">
                            <span class="gradient-text animate-gradient">${escapeHtml(card.text || '')}</span>
                        </h2>
                    </div>
                </div>
            `;
        }

        function displayCard(index) {
            if (index < 0 || index >= cards.length) return;

            const card = cards[index];
            const oldCardElement = currentCardElement;
            const oldIndex = currentIndex;
            const transitionType = card.transition || 'fade';

            // Créer le nouvel élément
            const newCardWrapper = document.createElement('div');
            newCardWrapper.className = 'card-wrapper';

            if (card.kind === 'goal') {
                buildGoalCard(newCardWrapper, card);
            } else {
                buildTextCard(newCardWrapper, card);
            }

            // Ajouter la nouvelle carte au DOM (invisible par défaut)
            overlayEl.appendChild(newCardWrapper);

            // Si une carte existe déjà, démarrer les deux animations simultanément
            if (oldCardElement) {
                const oldTransitionType = (cards[oldIndex] && cards[oldIndex].transition) || 'fade';

                // Démarrer la sortie de l'ancienne carte
                oldCardElement.classList.remove(getTransitionClasses(oldTransitionType, true));
                oldCardElement.classList.add(getTransitionClasses(oldTransitionType, false));

                // Forcer un reflow puis démarrer l'entrée de la nouvelle carte
                requestAnimationFrame(() => {
                    newCardWrapper.className = `card-wrapper ${getTransitionClasses(transitionType, true)}`;
                });

                // Supprimer l'ancienne carte après sa sortie (0.5s)
                setTimeout(() => {
                    if (oldCardElement && oldCardElement.parentNode) {
                        oldCardElement.parentNode.removeChild(oldCardElement);
                    }
                }, 500);
            } else {
                // Première carte, démarrer l'animation d'entrée
                requestAnimationFrame(() => {
                    newCardWrapper.className = `card-wrapper ${getTransitionClasses(transitionType, true)}`;
                });
            }

            currentCardElement = newCardWrapper;
            currentIndex = index;
        }

        // Ouvre les deux WS (live update) au chargement de la page.
        window.addEventListener('load', () => {
            connectWs();
            connectGoalWs();
        });

        // Cleanup on unload
        window.addEventListener('beforeunload', clearRotation);
    </script>
</body>
</html>
