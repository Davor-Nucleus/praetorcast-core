{% import "partials/_macros.html" as ui -%}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Config</title>
    <style>
        /* Page pensée pour un dock OBS (Docks → Docks de navigateur personnalisés),
           donc d'abord étroite : 260 à 450 px de large. Une ligne par réglage,
           libellé à gauche, commande à droite ; plus large, les blocs se mettent
           côte à côte. */
        :root {
            --bg: #16161e;
            --panel: #1f2335;
            --panel-2: #262b40;
            --border: #33395a;
            --text: #e6e9f5;
            --muted: #a3abcf;
            --accent: #7aa2f7;
            --on: #9ece6a;
            --danger: #f7768e;
            --radius: 8px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.35 "Instrument Sans", system-ui, sans-serif;
        }

        .dock {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 760px;
            margin: 0 auto;
            padding: 8px;
        }

        {% include "partials/_header.html" %}

        /* Bandeau commun réduit à une ligne discrète : dans un dock, chaque pixel
           de hauteur compte. Le bloc titre est vide sur cette page. */
        .page-header {
            margin: 0;
            justify-content: flex-end;
            gap: 8px;
        }

        .page-header > div:first-child { display: none; }
        /* Le macro pose `gap: 1rem` en style en ligne : seul `!important` le passe. */
        .page-header > div:last-child { gap: 10px !important; }
        .home-link { font-size: 12px; }
        .btn-copy-link { padding: 3px 8px; font-size: 12px; }

        .btn {
            border: 1px solid transparent;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn:focus-visible,
        .toggle:focus-visible,
        .folder:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 10px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .panel-title,
        .now-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Lecture ───────────────────────────────────────────────────────── */
        .now-title {
            margin: 2px 0 8px;
            font-size: 15px;
            font-weight: 700;
            overflow-wrap: anywhere;
            /* Deux lignes au plus : assez pour un titre d'OST, sans pousser le reste. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .now-title.is-empty { color: var(--muted); font-weight: 500; }

        .play-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 6px;
        }

        .folder {
            min-width: 0;
            height: 34px;
            padding: 0 8px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        .btn-play,
        .btn-stop {
            width: 40px;
            height: 34px;
            font-size: 15px;
        }

        .btn-play { background: var(--accent); color: #0f1220; }
        .btn-play:hover { background: #9ab8ff; }
        .btn-stop { background: transparent; color: var(--danger); border-color: var(--danger); }
        .btn-stop:hover { background: rgba(247, 118, 142, 0.15); }

        /* ── Réglages ──────────────────────────────────────────────────────── */
        .steppers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            column-gap: 16px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 36px;
        }

        .row-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-step {
            width: 30px;
            height: 30px;
            background: var(--panel-2);
            color: var(--text);
            border-color: var(--border);
            font-size: 17px;
            line-height: 1;
        }

        .btn-step:hover { border-color: var(--accent); color: var(--accent); }

        .value {
            min-width: 5.2ch;
            text-align: center;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 190 px : « Barre de progression » et son état tiennent sur une ligne.
           En dessous, une colonne plutôt que deux libellés cassés en deux. */
        .toggles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 6px;
            margin-top: 6px;
        }

        /* Interrupteur : pastille + nom + état, l'état lisible sans couleur. */
        .toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 34px;
            padding: 5px 9px;
            background: var(--panel-2);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            font: inherit;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
        }

        .toggle:hover { border-color: var(--accent); }

        .toggle-dot {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #4a5070;
        }

        .toggle-state {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .toggle.is-on {
            color: var(--text);
            border-color: rgba(158, 206, 106, 0.55);
        }

        .toggle.is-on .toggle-dot {
            background: var(--on);
            box-shadow: 0 0 6px var(--on);
        }

        .toggle.is-on .toggle-state { color: var(--on); }

        /* État inconnu (serveur injoignable) : pastille creuse, texte explicite. */
        .toggle.is-unknown .toggle-dot {
            background: transparent;
            border: 1px solid var(--muted);
        }

        /* ── Soundboard ────────────────────────────────────────────────────── */
        .btn-kill {
            padding: 3px 10px;
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
            font-size: 12px;
            font-weight: 700;
        }

        .btn-kill:hover { background: rgba(247, 118, 142, 0.15); }

        .sb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 6px;
        }

        .btn-sb {
            position: relative;
            min-height: 44px;
            padding: 6px 6px 5px;
            background: var(--panel-2);
            color: var(--text);
            border-color: var(--border);
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
        }

        .btn-sb:hover { border-color: var(--accent); }
        .btn-sb:active { background: var(--accent); color: #0f1220; }

        /* Nom sur deux lignes au lieu d'une coupée net : « FOR THE EMP… » ne se
           distinguait pas de « FOR THE EMPIRE 2 ». */
        .sb-name {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .sb-key {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
        }

        /* Place pour le raccourci au-dessus du nom. Une classe plutôt que `:has()`,
           que le navigateur intégré des OBS antérieurs à la 31 ne connaît pas. */
        .btn-sb.has-key { padding-top: 13px; }

        .hint {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="dock">
        {% call ui::header("","","","", "/music-current") %}

        <!-- Lecture -->
        <section class="panel">
            <span class="now-label">En cours</span>
            <div class="now-title is-empty" id="currentMusic" title="">Rien en lecture</div>
            <div class="play-row">
                <select class="folder" id="folderSelect" aria-label="Playlist à lancer">
                    <option value="">Chargement…</option>
                </select>
                <button class="btn btn-play" onclick="playMusic()" title="Lancer la playlist" aria-label="Lancer la playlist">▶</button>
                <button class="btn btn-stop" onclick="stopMusic()" title="Arrêter et vider la playlist" aria-label="Arrêter la musique">■</button>
            </div>
        </section>

        <!-- Réglages -->
        <section class="panel">
            <div class="steppers">
                <div class="row">
                    <span class="row-label">Volume</span>
                    <div class="stepper">
                        <button class="btn btn-step" onclick="updateVolume('subtract')" aria-label="Baisser le volume">−</button>
                        <span class="value"><span id="volume">–</span> %</span>
                        <button class="btn btn-step" onclick="updateVolume('add')" aria-label="Monter le volume">+</button>
                    </div>
                </div>
                <div class="row">
                    <span class="row-label">Seuil limiteur</span>
                    <div class="stepper">
                        <button class="btn btn-step" onclick="updateObsLimiter('subtract')" aria-label="Baisser le seuil du limiteur">−</button>
                        <span class="value"><span id="obsThreshold">–</span> dB</span>
                        <button class="btn btn-step" onclick="updateObsLimiter('add')" aria-label="Monter le seuil du limiteur">+</button>
                    </div>
                </div>
            </div>
            <div class="toggles">
                <button class="toggle is-unknown" id="normBtn" onclick="toggleNormalization()" aria-pressed="false"
                        title="Normalisation du volume des pistes (EBU R128)">
                    <span class="toggle-dot"></span><span>Normalisation</span><span class="toggle-state">–</span>
                </button>
                <button class="toggle is-unknown" id="progressBtn" onclick="toggleProgressBar()" aria-pressed="false"
                        title="Barre de progression de l'overlay /music-current">
                    <span class="toggle-dot"></span><span>Barre de progression</span><span class="toggle-state">–</span>
                </button>
                <button class="toggle is-unknown" id="obsLimiterBtn" onclick="toggleObsLimiter()" aria-pressed="false"
                        title="Filtre Limiteur sur la source musique dans OBS">
                    <span class="toggle-dot"></span><span>Limiteur OBS</span><span class="toggle-state">–</span>
                </button>
            </div>
        </section>

        <!-- Soundboard -->
        <section class="panel">
            <div class="panel-head">
                <span class="panel-title">Soundboard</span>
                <button class="btn btn-kill" onclick="stopSoundboard()" title="Couper tous les sons en cours">■ Couper</button>
            </div>
            <div class="sb-grid" id="soundboardGrid">
                <!-- Les sons seront ajoutés dynamiquement -->
            </div>
        </section>
    </div>

    <script src="/public/js/music-api.js"></script>
    <script>
        const MUSIC_PORT = {{ music_port }};
        const SOUNDBOARD_PORT = {{ soundboard_port }};
        const SHORTCUTS = {{ shortcuts_json|safe }};

        const MUSIC_API = `http://localhost:${MUSIC_PORT}`;
        const SOUNDBOARD_API = `http://localhost:${SOUNDBOARD_PORT}`;

        let folders = [];
        let soundboardSounds = [];
        let selectedFolder = "";
        let intervalId = null;
        let musicWs = null;
        let obsLimiterWs = null;

        // Fetch helpers
        async function fetchMusic(endpoint, options) {
            try {
                const res = await fetch(`${MUSIC_API}${endpoint}`, options);
                return res.ok ? await res.json() : null;
            } catch (e) {
                console.error(`Music API Error (${endpoint}):`, e);
                return null;
            }
        }

        async function fetchSoundboard(endpoint) {
            try {
                const res = await fetch(`${SOUNDBOARD_API}${endpoint}`);
                return res.ok ? await res.json() : null;
            } catch (e) {
                console.error(`Soundboard API Error (${endpoint}):`, e);
                return null;
            }
        }

        /** Nom de fichier sans son extension : « Zoltraak.mp3 » → « Zoltraak ». */
        function withoutExtension(name) {
            return String(name || '').replace(/\.[a-z0-9]{2,4}$/i, '');
        }

        /** Raccourci du n-ième son (à partir de 0), mis en forme : « alt+1 » → « Alt+1 ». */
        function shortcutFor(index) {
            const shortcut = SHORTCUTS[String(index + 1)];
            if (!shortcut) return '';
            return shortcut
                .split('+')
                .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
                .join('+');
        }

        /**
         * Interrupteur : `true` allumé, `false` éteint, `null` état inconnu (serveur
         * injoignable). `note` remplace l'état affiché, pour dire pourquoi.
         */
        function setToggle(id, state, note) {
            const btn = document.getElementById(id);
            btn.classList.toggle('is-on', state === true);
            btn.classList.toggle('is-unknown', state === null);
            btn.setAttribute('aria-pressed', String(state === true));
            const label = btn.querySelector('.toggle-state');
            if (label) label.textContent = note || (state === null ? '–' : state ? 'ON' : 'OFF');
        }

        // Actions
        async function updateVolume(action) {
            const endpoint = action === "get" ? "/api/volume" : `/api/volume/${action}`;
            const data = await fetchMusic(endpoint);
            if (data && typeof data.volume === "number") {
                document.getElementById('volume').textContent = Math.round(data.volume * 100);
            }
        }

        async function updateNormalization() {
            const data = await fetchMusic("/api/normalization");
            if (data && typeof data.normalization_enabled === "boolean") {
                setNormalizationUI(data.normalization_enabled);
            }
        }

        async function toggleNormalization() {
            const data = await fetchMusic("/api/normalization/toggle");
            if (data && typeof data.normalization_enabled === "boolean") {
                setNormalizationUI(data.normalization_enabled);
            }
        }

        function setNormalizationUI(enabled) {
            setToggle('normBtn', enabled);
        }

        // Barre de progression de /music-current : portée par JanusCore, auquel
        // l'overlay est connecté — elle apparaît ou disparaît sans rafraîchir OBS.
        async function updateProgressBar() {
            const data = await fetchMusic("/api/progress_bar");
            if (data && typeof data.progress_bar_enabled === "boolean") {
                setProgressBarUI(data.progress_bar_enabled);
            }
        }

        async function toggleProgressBar() {
            const data = await fetchMusic("/api/progress_bar/toggle");
            if (data && typeof data.progress_bar_enabled === "boolean") {
                setProgressBarUI(data.progress_bar_enabled);
            }
        }

        function setProgressBarUI(enabled) {
            setToggle('progressBtn', enabled);
        }

        // Limiteur OBS : endpoints same-origin servis par praetorcast-core
        async function fetchLocal(endpoint) {
            try {
                const res = await fetch(endpoint);
                return res.ok ? await res.json() : null;
            } catch (e) {
                console.error(`OBS API Error (${endpoint}):`, e);
                return null;
            }
        }

        async function updateObsLimiter(action) {
            const endpoint = action === "get" ? "/api/obs/limiter" : `/api/obs/limiter/${action}`;
            setObsLimiterUI(await fetchLocal(endpoint));
        }

        async function toggleObsLimiter() {
            setObsLimiterUI(await fetchLocal("/api/obs/limiter/toggle"));
        }

        function setObsLimiterUI(data) {
            const thresholdEl = document.getElementById('obsThreshold');
            if (!data || typeof data.threshold !== "number" || typeof data.enabled !== "boolean") {
                // OBS injoignable / filtre absent : état dégradé non bloquant
                thresholdEl.textContent = '–';
                setToggle('obsLimiterBtn', null, 'OBS absent');
                return;
            }
            thresholdEl.textContent = Math.round(data.threshold);
            setToggle('obsLimiterBtn', data.enabled);
        }

        function showTrack(track) {
            const elem = document.getElementById('currentMusic');
            elem.textContent = track ? withoutExtension(track) : 'Rien en lecture';
            elem.title = track || '';
            elem.classList.toggle('is-empty', !track);
        }

        function initMusicWS() {
            musicWs = connectMusicWS(MUSIC_PORT, showTrack);
        }

        function initObsLimiterWS() {
            obsLimiterWs = connectObsLimiterWS(setObsLimiterUI);
        }

        async function loadFolders() {
            const select = document.getElementById('folderSelect');
            const data = await fetchMusic("/api/folderlist");
            if (!data || !Array.isArray(data.folders)) {
                // Sans ce message, « Chargement… » restait affiché pour toujours.
                select.innerHTML = '<option value="">JanusCore injoignable</option>';
                return;
            }
            folders = data.folders;
            select.innerHTML = '';
            folders.forEach(folder => {
                const option = document.createElement('option');
                option.value = folder;
                option.textContent = folder;
                select.appendChild(option);
            });
            if (folders.length > 0) {
                selectedFolder = folders[0];
                select.value = selectedFolder;
            }
        }

        async function playMusic() {
            const select = document.getElementById('folderSelect');
            selectedFolder = select.value;
            if (!selectedFolder) return;
            await fetchMusic(`/api/folder?folder=${encodeURIComponent(selectedFolder)}`);
        }

        async function stopMusic() {
            await fetchMusic("/api/stop");
        }

        function soundHint(text) {
            const hint = document.createElement('p');
            hint.className = 'hint';
            hint.textContent = text;
            return hint;
        }

        async function loadSoundboard() {
            const grid = document.getElementById('soundboardGrid');
            const data = await fetchSoundboard("/api/soundboard/sounds");
            if (!data || !Array.isArray(data.sounds)) {
                grid.replaceChildren(soundHint('Soundboard injoignable : PhonosCore est-il lancé ?'));
                return;
            }
            soundboardSounds = data.sounds;
            if (soundboardSounds.length === 0) {
                grid.replaceChildren(soundHint('Aucun son dans public/soundboard.'));
                return;
            }

            grid.replaceChildren();
            soundboardSounds.forEach((sound, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-sb';
                btn.title = sound;
                btn.onclick = () => playSound(sound);

                const key = shortcutFor(index);
                if (key) {
                    btn.classList.add('has-key');
                    const badge = document.createElement('span');
                    badge.className = 'sb-key';
                    badge.textContent = key;
                    btn.appendChild(badge);
                }

                const name = document.createElement('span');
                name.className = 'sb-name';
                name.textContent = withoutExtension(sound);
                btn.appendChild(name);

                grid.appendChild(btn);
            });
        }

        async function playSound(sound) {
            await fetchSoundboard(`/api/soundboard/play?sound=${encodeURIComponent(sound)}`);
        }

        async function stopSoundboard() {
            await fetchSoundboard("/api/soundboard/stop");
        }

        function handleKeydown(event) {
            const pressedKey = event.key.toLowerCase();
            const modifier = event.ctrlKey ? "ctrl+" : event.altKey ? "alt+" : "";
            const shortcut = modifier + pressedKey;

            // Check shortcuts
            const soundIndexStr = Object.keys(SHORTCUTS).find(
                key => SHORTCUTS[key] === shortcut
            );

            if (soundIndexStr) {
                const index = parseInt(soundIndexStr, 10);
                if (!isNaN(index) && index > 0 && soundboardSounds[index - 1]) {
                    playSound(soundboardSounds[index - 1]);
                }
            }
        }

        // Initialisation
        async function init() {
            await loadFolders();
            updateVolume("get");
            updateNormalization();
            updateProgressBar();
            updateObsLimiter("get");
            initMusicWS();
            initObsLimiterWS();
            await loadSoundboard();

            intervalId = setInterval(() => {
                updateVolume("get");
                updateNormalization();
                updateProgressBar();
            }, 1000);
        }

        window.addEventListener('keydown', handleKeydown);
        window.addEventListener('load', init);
        window.addEventListener('beforeunload', () => {
            if (intervalId) clearInterval(intervalId);
            if (musicWs) musicWs.close();
            if (obsLimiterWs) obsLimiterWs.close();
            window.removeEventListener('keydown', handleKeydown);
        });
    </script>
</body>
</html>
