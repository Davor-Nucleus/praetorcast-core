<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Channel Points Configurator</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-light: #333333;
            --accent-primary: #3b82f6;
            --accent-secondary: #2563eb;
            --accent-glow: #60a5fa;
            --accent-green: #22c55e;
            --danger: #ef4444;
            --danger-bg: #450a0a;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: "Instrument Sans", sans-serif;
        }

        .page-container {
            min-height: 100vh;
            padding: var(--spacing-xl);
        }

        .page-header {
            margin-bottom: var(--spacing-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--accent-glow);
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            max-width: 56rem;
            margin: 0 auto;
        }

        .card-item {
            background-color: var(--bg-card);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: var(--spacing-lg);
            align-items: flex-start;
            transition: transform 0.3s ease;
        }

        .reward-header {
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }

        .reward-title-input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
        }

        .reward-title-input:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .media-section {
            display: flex;
            gap: var(--spacing-lg);
            width: 100%;
        }

        .media-block {
            flex: 1;
            background-color: var(--bg-dark);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            border: 1px solid var(--border-light);
        }

        .media-block-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: var(--spacing-sm);
        }

        .preview-container {
            width: 100%;
            height: 100px;
            background-color: #0a0a0a;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-media-placeholder {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
        }

        .upload-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .preview-container:hover .upload-overlay {
            opacity: 1;
        }

        .upload-label {
            cursor: pointer;
            font-size: 0.75rem;
            color: white;
            text-decoration: underline;
        }

        .hidden-input {
            display: none;
        }

        .sound-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            width: 100%;
        }

        .sound-name {
            font-size: 0.75rem;
            color: var(--text-main);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sound-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
            justify-content: center;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-play {
            background-color: var(--accent-primary);
        }

        .btn-play:hover {
            background-color: var(--accent-secondary);
        }

        .btn-remove-sound {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-remove-sound:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .text-input-group {
            margin-top: var(--spacing-md);
        }

        .text-input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .text-input-group input,
        .text-input-group select {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm);
            color: var(--text-main);
            font-size: 0.875rem;
        }

        .text-input-group input:focus,
        .text-input-group select:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .controls-right {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }

        .btn-icon {
            padding: var(--spacing-sm);
            background-color: var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-main);
            border: none;
            cursor: pointer;
        }

        .btn-icon:hover {
            background-color: #525252;
        }

        .btn-delete {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .btn-add-card {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-lg);
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-card:hover {
            border-color: var(--accent-glow);
            color: var(--accent-glow);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        .status-disconnected {
            background-color: var(--danger);
        }

        .twitch-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="page-header">
            <div>
                <h1 class="page-title">Channel Points Configurator</h1>
                <p class="page-subtitle">Configurez les récompenses de points de chaîne Twitch.</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="twitch-status" id="twitchStatus">
                    <span class="status-dot status-disconnected" id="statusDot"></span>
                    <span id="statusText">Twitch: Déconnecté</span>
                </div>
                <a href="/" style="color: var(--text-muted); text-decoration: underline;">Back to Home</a>
                <button onclick="saveConfig()" class="btn btn-save">Save Configuration</button>
            </div>
        </header>

        <div class="card-list" id="cardList">
            <!-- Les récompenses seront ajoutées dynamiquement -->
        </div>
    </div>

    <script>
        // Doit rester aligné sur les classes CSS <type>-in / <type>-out de channel_point.html
        const TRANSITIONS = [
            { value: 'fade', label: 'Fondu' },
            { value: 'slide', label: 'Glissement' },
            { value: 'zoom', label: 'Zoom' },
            { value: 'flip', label: 'Retournement' }
        ];

        let rewards = [];

        async function loadConfig() {
            try {
                const response = await fetch('/api/channel-points-config');
                if (response.ok) {
                    rewards = await response.json();
                    renderCards();
                } else {
                    console.error('Failed to load config');
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        function renderCards() {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            rewards.forEach((reward, index) => {
                const cardItem = document.createElement('div');
                cardItem.className = 'card-item';
                cardItem.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; gap:var(--spacing-md);">
                        <div class="reward-header">
                            <input type="text" value="${escapeHtml(reward.reward_title || '')}" placeholder="Nom de la récompense Twitch (exact)" class="reward-title-input" onchange="updateRewardTitle(${index}, this.value)" />
                        </div>

                        <div class="media-section">
                            <div class="media-block">
                                <div class="media-block-title">Image / GIF</div>
                                <div class="preview-container" id="imagePreview-${index}">
                                    ${reward.imagePath ? `<img src="${reward.imagePath}" alt="Preview" class="preview-image" />` : '<span class="no-media-placeholder">Aucune image</span>'}
                                    <div class="upload-overlay">
                                        <label class="upload-label">
                                            ${reward.imagePath ? 'Changer' : 'Uploader'}
                                            <input type="file" accept="image/*" class="hidden-input" onchange="handleImageUpload(${index}, event)" />
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="media-block">
                                <div class="media-block-title">Son</div>
                                <div class="preview-container" id="soundPreview-${index}">
                                    ${reward.soundPath ? `
                                        <div class="sound-preview">
                                            <span class="sound-name">${reward.soundPath.split('/').pop()}</span>
                                        </div>
                                    ` : '<span class="no-media-placeholder">Aucun son</span>'}
                                    <div class="upload-overlay">
                                        <label class="upload-label">
                                            ${reward.soundPath ? 'Changer' : 'Uploader'}
                                            <input type="file" accept="audio/*" class="hidden-input" onchange="handleSoundUpload(${index}, event)" />
                                        </label>
                                    </div>
                                </div>
                                ${reward.soundPath ? `
                                    <div class="sound-actions">
                                        <button class="btn-small btn-play" onclick="playSound(${index})">▶ Jouer</button>
                                        <button class="btn-small btn-remove-sound" onclick="removeSound(${index})">✕ Retirer</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="text-input-group">
                            <label for="phrase-${index}">Phrase à afficher (optionnel)</label>
                            <input id="phrase-${index}" type="text" value="${escapeHtml(reward.phrase || '')}" placeholder="Merci \{\{user\}\} pour le \{\{reward\}\} !" onchange="updatePhrase(${index}, this.value)" />
                        </div>

                        <div class="text-input-group">
                            <label for="transition-${index}">Transition</label>
                            <select id="transition-${index}" onchange="updateTransition(${index}, this.value)">
                                ${renderTransitionOptions(reward.transition)}
                            </select>
                        </div>
                    </div>

                    <div class="controls-right">
                        <button onclick="moveUp(${index})" class="btn-icon" ${index === 0 ? 'disabled' : ''}>↑</button>
                        <button onclick="moveDown(${index})" class="btn-icon" ${index === rewards.length - 1 ? 'disabled' : ''}>↓</button>
                        <button onclick="removeCard(${index})" class="btn-icon btn-delete">✕</button>
                    </div>
                `;
                cardList.appendChild(cardItem);
            });

            const addButton = document.createElement('button');
            addButton.className = 'btn-add-card';
            addButton.textContent = '+ Add New Reward';
            addButton.onclick = addCard;
            cardList.appendChild(addButton);
        }

        function renderTransitionOptions(current) {
            const selected = current || 'fade';
            return TRANSITIONS
                .map((t) => `<option value="${t.value}" ${t.value === selected ? 'selected' : ''}>${t.label}</option>`)
                .join('');
        }

        function addCard() {
            rewards.push({
                reward_title: '',
                phrase: '',
                imagePath: '',
                soundPath: '',
                transition: 'fade'
            });
            renderCards();
        }

        function removeCard(index) {
            rewards = rewards.filter((_, i) => i !== index);
            renderCards();
        }

        function updateRewardTitle(index, value) {
            rewards[index].reward_title = value;
        }

        function updatePhrase(index, value) {
            rewards[index].phrase = value;
        }

        function updateTransition(index, value) {
            rewards[index].transition = value;
        }

        async function handleImageUpload(index, event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/channel-points-upload-image', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    rewards[index].imagePath = data.path;
                    renderCards();
                } else {
                    alert('Failed to upload image');
                }
            } catch (error) {
                console.error('Error uploading image:', error);
                alert('Error uploading image');
            }
        }

        async function handleSoundUpload(index, event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/channel-points-upload-sound', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    rewards[index].soundPath = data.path;
                    renderCards();
                } else {
                    alert('Failed to upload sound');
                }
            } catch (error) {
                console.error('Error uploading sound:', error);
                alert('Error uploading sound');
            }
        }

        function playSound(index) {
            const reward = rewards[index];
            if (reward.soundPath) {
                const audio = new Audio(reward.soundPath);
                audio.play().catch(e => console.error('Error playing sound:', e));
            }
        }

        function removeSound(index) {
            rewards[index].soundPath = '';
            renderCards();
        }

        function moveUp(index) {
            if (index > 0) {
                const temp = rewards[index];
                rewards[index] = rewards[index - 1];
                rewards[index - 1] = temp;
                renderCards();
            }
        }

        function moveDown(index) {
            if (index < rewards.length - 1) {
                const temp = rewards[index];
                rewards[index] = rewards[index + 1];
                rewards[index + 1] = temp;
                renderCards();
            }
        }

        async function saveConfig() {
            try {
                const response = await fetch('/api/channel-points-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(rewards)
                });

                if (response.ok) {
                    alert('Configuration saved successfully!');
                    await loadConfig();
                } else {
                    const error = await response.json();
                    alert('Failed to save: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving config:', error);
                alert('Failed to save: ' + error);
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        // Connexion WebSocket Twitch pour le statut
        function connectTwitchWs() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            let ws;
            try {
                ws = new WebSocket(`${proto}://${location.host}/api/twitch_ws`);
            } catch (e) {
                return;
            }

            ws.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // `twitch_ws` émet {total_followers, last_follower, connected} :
                    // il n'y a pas de champ `type`, la pastille ne passait donc
                    // jamais au vert.
                    if (typeof data.connected === 'boolean') {
                        const dot = document.getElementById('statusDot');
                        const text = document.getElementById('statusText');
                        if (data.connected) {
                            dot.className = 'status-dot status-connected';
                            text.textContent = 'Twitch: Connecté';
                        } else {
                            dot.className = 'status-dot status-disconnected';
                            text.textContent = 'Twitch: Déconnecté';
                        }
                    }
                } catch (e) {}
            });

            ws.addEventListener('close', () => {
                setTimeout(connectTwitchWs, 2000);
            });
        }

        window.addEventListener('load', () => {
            loadConfig();
            connectTwitchWs();
        });
    </script>
</body>
</html>
