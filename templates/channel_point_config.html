{% import "partials/_macros.html" as ui -%}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Channel Points Configurator</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-light: #333333;
            --accent-primary: #3b82f6;
            --accent-secondary: #2563eb;
            --accent-glow: #60a5fa;
            --accent-green: #22c55e;
            --danger: #ef4444;
            --danger-bg: #450a0a;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: "Instrument Sans", sans-serif;
        }

        .page-container {
            min-height: 100vh;
            padding: var(--spacing-xl);
        }

        {% include "partials/_header.html" %}

        .btn {
            padding: var(--spacing-sm) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            max-width: 56rem;
            margin: 0 auto;
        }

        .card-item {
            background-color: var(--bg-card);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            display: flex;
            gap: var(--spacing-lg);
            align-items: flex-start;
            transition: transform 0.3s ease;
        }

        .reward-header {
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }

        .reward-title-input {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
        }

        .reward-title-input:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .media-section {
            display: flex;
            gap: var(--spacing-lg);
            width: 100%;
        }

        .media-block {
            flex: 1;
            background-color: var(--bg-dark);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            border: 1px solid var(--border-light);
        }

        .media-block-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: var(--spacing-sm);
        }

        .preview-container {
            width: 100%;
            height: 100px;
            background-color: #0a0a0a;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .no-media-placeholder {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
        }

        .upload-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .preview-container:hover .upload-overlay {
            opacity: 1;
        }

        .upload-label {
            cursor: pointer;
            font-size: 0.75rem;
            color: white;
            text-decoration: underline;
        }

        .hidden-input {
            display: none;
        }

        .sound-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            width: 100%;
        }

        .sound-name {
            font-size: 0.75rem;
            color: var(--text-main);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sound-actions {
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
            justify-content: center;
        }

        .btn-small {
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            color: white;
        }

        .btn-play {
            background-color: var(--accent-primary);
        }

        .btn-play:hover {
            background-color: var(--accent-secondary);
        }

        .btn-remove-sound {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-remove-sound:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .text-input-group {
            margin-top: var(--spacing-md);
        }

        .text-input-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .text-input-group input,
        .text-input-group select {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm);
            color: var(--text-main);
            font-size: 0.875rem;
        }

        .text-input-group input:focus,
        .text-input-group select:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        /* Explication sous un champ : plus discrète que le libellé, qu'elle ne doit
           pas concurrencer. */
        .field-hint {
            display: block;
            margin-top: 0.35rem;
            font-size: 0.7rem;
            line-height: 1.35;
            color: var(--text-muted);
        }

        /* Ligne « Tester » : le bouton et le retour du serveur sur la même base que les
           champs au-dessus, pour ne pas ressembler à une action de la carte entière. */
        .test-row {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-sm);
        }

        .btn-test {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--accent-glow);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-test:hover {
            background-color: rgba(59, 130, 246, 0.15);
        }

        .btn-test:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .test-status {
            font-size: 0.7rem;
            line-height: 1.35;
            color: var(--text-muted);
        }

        /* Un test parti sans destinataire : la cause la plus fréquente d'un « rien ne
           se passe », donc signalée autrement qu'un succès. */
        .test-status.is-warning {
            color: #fbbf24;
        }

        .controls-right {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            flex-shrink: 0;
        }

        .btn-icon {
            padding: var(--spacing-sm);
            background-color: var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-main);
            border: none;
            cursor: pointer;
        }

        .btn-icon:hover {
            background-color: #525252;
        }

        .btn-delete {
            background-color: var(--danger-bg);
            color: var(--danger);
        }

        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        .btn-add-card {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-lg);
            background: transparent;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add-card:hover {
            border-color: var(--accent-glow);
            color: var(--accent-glow);
        }

    </style>
</head>
<body>
    <div class="page-container">

        {% call ui::header("Configuration des Points de Chaîne", "Gérer les récompenses de points de chaîne Twitch" , "saveConfig()", "Sauvegarder", "/channel-points") %}

        <div class="card-list" id="cardList">
            <!-- Les récompenses seront ajoutées dynamiquement -->
        </div>
    </div>

    <script>
        // Doit rester aligné sur les classes CSS <type>-in / <type>-out de channel_point.html
        const TRANSITIONS = [
            { value: 'fade', label: 'Fondu' },
            { value: 'slide', label: 'Glissement' },
            { value: 'zoom', label: 'Zoom' },
            { value: 'flip', label: 'Retournement' }
        ];

        // `value` doit correspondre au `snake_case` de `models::channel_point::AlertKind`.
        // `amount` nomme ce que porte le palier pour ce type ; vide = pas de palier.
        const KINDS = [
            { value: 'channel_points', label: 'Points de chaîne', amount: '' },
            { value: 'sub', label: 'Abonnement', amount: 'Palier minimum (1000, 2000, 3000)' },
            { value: 'resub', label: 'Réabonnement', amount: 'Palier minimum (1000, 2000, 3000)' },
            { value: 'gift', label: 'Abonnements offerts', amount: 'Nombre minimum offert' },
            { value: 'cheer', label: 'Bits', amount: 'Bits minimum' },
            { value: 'raid', label: 'Raid', amount: 'Spectateurs minimum' },
            // Pas de palier : un Prime est toujours au tier 1, et le nombre de mois
            // n'entre pas dans la sélection. `amount: ''` marque ce cas, comme pour
            // les points de chaîne.
            { value: 'prime', label: 'Abonnement Prime', amount: '' }
        ];

        // Animations de la phrase, rendues par le moteur de /text. Mêmes clés et
        // libellés que /text-config (vérifié par tests/js/channel-point-config) ;
        // le défilement en moins, qui ferait sortir la phrase de l'écran.
        const TEXT_ENTRANCES = [
            ['none', 'Aucune'],
            ['fade', 'Fondu'],
            ['slide', 'Glissement'],
            ['zoom', 'Zoom'],
            ['flip', 'Bascule'],
            ['bounce', 'Rebond'],
            ['drop', 'Chute'],
            ['swing', 'Balancement'],
            ['blur', 'Mise au point'],
            ['rise', 'Montée'],
            ['reveal', 'Dévoilement'],
            ['spin', 'Tournoiement'],
            ['stamp', 'Tampon'],
            ['flicker', 'Allumage'],
            ['typewriter', 'Machine à écrire'],
            ['cascade', 'Cascade'],
            ['scatter', 'Dispersion'],
        ];

        const TEXT_EFFECTS = [
            ['none', 'Aucun'],
            ['gradient', 'Dégradé animé'],
            ['pulse', 'Pulsation'],
            ['wave', 'Vague'],
            ['glitch', 'Glitch'],
            ['float', 'Lévitation'],
            ['tilt', 'Balancier'],
            ['shake', 'Tremblement'],
            ['neon', 'Néon'],
            ['rainbow', 'Arc-en-ciel'],
            ['blink', 'Clignotement'],
            ['heartbeat', 'Battement'],
            ['shine', 'Reflet'],
            ['jelly', 'Gelée'],
            ['revolve', 'Rotation 3D'],
        ];

        function kindOf(reward) {
            return reward.kind || 'channel_points';
        }

        function kindMeta(value) {
            return KINDS.find((k) => k.value === value) || KINDS[0];
        }

        let rewards = [];

        async function loadConfig() {
            try {
                const response = await fetch('/api/channel-points-config');
                if (response.ok) {
                    rewards = await response.json();
                    renderCards();
                } else {
                    console.error('Failed to load config');
                }
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        function renderCards() {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            rewards.forEach((reward, index) => {
                const kind = kindOf(reward);
                const meta = kindMeta(kind);
                const cardItem = document.createElement('div');
                cardItem.className = 'card-item';
                cardItem.innerHTML = `
                    <div style="flex:1; display:flex; flex-direction:column; gap:var(--spacing-md);">
                        <div class="text-input-group">
                            <label for="kind-${index}">Déclencheur</label>
                            <select id="kind-${index}" onchange="updateKind(${index}, this.value)">
                                ${renderKindOptions(kind)}
                            </select>
                        </div>

                        ${kind === 'channel_points' ? `
                            <div class="reward-header">
                                <input type="text" value="${escapeHtml(reward.reward_title || '')}" placeholder="Nom de la récompense Twitch (exact)" class="reward-title-input" onchange="updateRewardTitle(${index}, this.value)" />
                            </div>
                        ` : ''}
                        ${!meta.amount ? '' : `
                            <div class="text-input-group">
                                <label for="minAmount-${index}">${meta.amount}</label>
                                <input id="minAmount-${index}" type="number" min="0" step="1" value="${Number(reward.minAmount || 0)}" onchange="updateMinAmount(${index}, this.value)" />
                                <small class="field-hint">0 déclenche pour n'importe quel montant. Plusieurs lignes du même type forment des paliers : la plus élevée qui reste atteinte gagne.</small>
                            </div>
                        `}
                        ${kind !== 'prime' ? '' : `
                            <small class="field-hint">Couvre le premier abonnement Prime et son renouvellement. Sans cette ligne, un Prime joue « Abonnement » ou « Réabonnement ».</small>
                        `}

                        <div class="media-section">
                            <div class="media-block">
                                <div class="media-block-title">Image / GIF</div>
                                <div class="preview-container" id="imagePreview-${index}">
                                    ${reward.imagePath ? `<img src="${escapeHtml(reward.imagePath)}" alt="Preview" class="preview-image" />` : '<span class="no-media-placeholder">Aucune image</span>'}
                                    <div class="upload-overlay">
                                        <label class="upload-label">
                                            ${reward.imagePath ? 'Changer' : 'Uploader'}
                                            <input type="file" accept="image/*" class="hidden-input" onchange="handleImageUpload(${index}, event)" />
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="media-block">
                                <div class="media-block-title">Son</div>
                                <div class="preview-container" id="soundPreview-${index}">
                                    ${reward.soundPath ? `
                                        <div class="sound-preview">
                                            <span class="sound-name">${escapeHtml(reward.soundPath.split('/').pop())}</span>
                                        </div>
                                    ` : '<span class="no-media-placeholder">Aucun son</span>'}
                                    <div class="upload-overlay">
                                        <label class="upload-label">
                                            ${reward.soundPath ? 'Changer' : 'Uploader'}
                                            <input type="file" accept="audio/*" class="hidden-input" onchange="handleSoundUpload(${index}, event)" />
                                        </label>
                                    </div>
                                </div>
                                ${reward.soundPath ? `
                                    <div class="sound-actions">
                                        <button class="btn-small btn-play" onclick="playSound(${index})">▶ Jouer</button>
                                        <button class="btn-small btn-remove-sound" onclick="removeSound(${index})">✕ Retirer</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <div class="text-input-group">
                            <label for="phrase-${index}">Phrase à afficher (optionnel)</label>
                            <input id="phrase-${index}" type="text" value="${escapeHtml(reward.phrase || '')}" placeholder="Merci \{\{user\}\} pour le \{\{reward\}\} !" onchange="updatePhrase(${index}, this.value)" />
                            <small class="field-hint">Jetons : \{\{user\}\}, \{\{amount\}\}, \{\{tier\}\}, \{\{months\}\}, \{\{input\}\}, \{\{reward\}\}</small>
                        </div>

                        <div class="text-input-group">
                            <label for="textAnimation-${index}">Animation de la phrase</label>
                            <select id="textAnimation-${index}" onchange="updateTextAnimation(${index}, this.value)">
                                ${renderPairOptions(TEXT_ENTRANCES, reward.textAnimation || 'none')}
                            </select>
                        </div>

                        <div class="text-input-group">
                            <label for="textEffect-${index}">Effet continu de la phrase</label>
                            <select id="textEffect-${index}" onchange="updateTextEffect(${index}, this.value)">
                                ${renderPairOptions(TEXT_EFFECTS, reward.textEffect || 'gradient')}
                            </select>
                            <small class="field-hint">Les mêmes animations que les textes de /text-config. L'effet démarre à la fin de l'animation d'entrée.</small>
                        </div>

                        <div class="text-input-group">
                            <label for="transition-${index}">Transition</label>
                            <select id="transition-${index}" onchange="updateTransition(${index}, this.value)">
                                ${renderTransitionOptions(reward.transition)}
                            </select>
                        </div>

                        <div class="test-row">
                            <button id="test-${index}" class="btn-test" onclick="testCard(${index})">▶ Tester dans OBS</button>
                            <span class="test-status" id="testStatus-${index}">Joue cette ligne dans les sources <code>/channel-points</code> ouvertes, sans attendre l'événement Twitch. Les modifications non enregistrées sont prises en compte.</span>
                        </div>
                    </div>

                    <div class="controls-right">
                        <button onclick="moveUp(${index})" class="btn-icon" ${index === 0 ? 'disabled' : ''}>↑</button>
                        <button onclick="moveDown(${index})" class="btn-icon" ${index === rewards.length - 1 ? 'disabled' : ''}>↓</button>
                        <button onclick="removeCard(${index})" class="btn-icon btn-delete">✕</button>
                    </div>
                `;
                cardList.appendChild(cardItem);
            });

            const addButton = document.createElement('button');
            addButton.className = 'btn-add-card';
            addButton.textContent = '+ Add New Reward';
            addButton.onclick = addCard;
            cardList.appendChild(addButton);
        }

        function renderTransitionOptions(current) {
            const selected = current || 'fade';
            return TRANSITIONS
                .map((t) => `<option value="${t.value}" ${t.value === selected ? 'selected' : ''}>${t.label}</option>`)
                .join('');
        }

        function renderPairOptions(pairs, current) {
            return pairs
                .map(([value, label]) => `<option value="${value}" ${value === current ? 'selected' : ''}>${label}</option>`)
                .join('');
        }

        function renderKindOptions(current) {
            return KINDS
                .map((k) => `<option value="${k.value}" ${k.value === current ? 'selected' : ''}>${k.label}</option>`)
                .join('');
        }

        function addCard() {
            rewards.push({
                kind: 'channel_points',
                reward_title: '',
                minAmount: 0,
                phrase: '',
                imagePath: '',
                soundPath: '',
                transition: 'fade',
                textAnimation: 'none',
                textEffect: 'gradient'
            });
            renderCards();
        }

        function removeCard(index) {
            rewards = rewards.filter((_, i) => i !== index);
            renderCards();
        }

        function updateRewardTitle(index, value) {
            rewards[index].reward_title = value;
        }

        // Changer de déclencheur remplace le champ affiché (titre exact ↔ palier) :
        // il faut redessiner la carte, contrairement aux autres champs.
        function updateKind(index, value) {
            rewards[index].kind = value;
            renderCards();
        }

        function updateMinAmount(index, value) {
            // `Math.max(0, …)` plutôt que la seule contrainte `min="0"` du champ : une
            // valeur négative ou vide saisie au clavier arriverait sinon en NaN, et le
            // serveur attend un entier non signé.
            const amount = Math.max(0, Math.floor(Number(value) || 0));
            rewards[index].minAmount = amount;
        }

        function updatePhrase(index, value) {
            rewards[index].phrase = value;
        }

        function updateTransition(index, value) {
            rewards[index].transition = value;
        }

        function updateTextAnimation(index, value) {
            rewards[index].textAnimation = value;
        }

        function updateTextEffect(index, value) {
            rewards[index].textEffect = value;
        }

        async function handleImageUpload(index, event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/channel-points-upload-image', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    rewards[index].imagePath = data.path;
                    renderCards();
                } else {
                    alert('Failed to upload image');
                }
            } catch (error) {
                console.error('Error uploading image:', error);
                alert('Error uploading image');
            }
        }

        async function handleSoundUpload(index, event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/channel-points-upload-sound', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    rewards[index].soundPath = data.path;
                    renderCards();
                } else {
                    alert('Failed to upload sound');
                }
            } catch (error) {
                console.error('Error uploading sound:', error);
                alert('Error uploading sound');
            }
        }

        function setTestStatus(index, message, isWarning) {
            const status = document.getElementById('testStatus-' + index);
            if (!status) return;
            status.textContent = message;
            status.classList.toggle('is-warning', isWarning === true);
        }

        // Envoie la ligne telle qu'elle est **affichée** : c'est ce qui permet d'essayer
        // une phrase ou un son avant d'enregistrer. Le serveur en déduit un événement
        // représentatif (montant du palier, nom fictif) et le diffuse aux overlays, qui
        // ne distinguent pas ce message d'une vraie alerte.
        async function testCard(index) {
            const reward = rewards[index];
            if (!reward) return;

            const button = document.getElementById('test-' + index);
            if (button) button.disabled = true;
            setTestStatus(index, 'Envoi...');

            try {
                const response = await fetch('/api/channel-points/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(reward)
                });

                if (!response.ok) {
                    setTestStatus(index, 'Échec de l\'envoi (HTTP ' + response.status + ')', true);
                    return;
                }

                const data = await response.json();
                if (data.overlays > 0) {
                    setTestStatus(index, 'Envoyé à ' + data.overlays + (data.overlays > 1 ? ' sources' : ' source') + '.');
                } else {
                    // Le cas à expliquer : le serveur a bien reçu le test, mais personne
                    // ne l'affiche. Ouvrir /channel-points suffit.
                    setTestStatus(index, 'Aucune source /channel-points ouverte : rien à afficher.', true);
                }
            } catch (error) {
                console.error('Error testing alert:', error);
                setTestStatus(index, 'Échec de l\'envoi : ' + error, true);
            } finally {
                if (button) button.disabled = false;
            }
        }

        function playSound(index) {
            const reward = rewards[index];
            if (reward.soundPath) {
                const audio = new Audio(reward.soundPath);
                audio.play().catch(e => console.error('Error playing sound:', e));
            }
        }

        function removeSound(index) {
            rewards[index].soundPath = '';
            renderCards();
        }

        function moveUp(index) {
            if (index > 0) {
                const temp = rewards[index];
                rewards[index] = rewards[index - 1];
                rewards[index - 1] = temp;
                renderCards();
            }
        }

        function moveDown(index) {
            if (index < rewards.length - 1) {
                const temp = rewards[index];
                rewards[index] = rewards[index + 1];
                rewards[index + 1] = temp;
                renderCards();
            }
        }

        async function saveConfig() {
            try {
                const response = await fetch('/api/channel-points-config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(rewards)
                });

                if (response.ok) {
                    alert('Configuration saved successfully!');
                    await loadConfig();
                } else {
                    const error = await response.json();
                    alert('Failed to save: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving config:', error);
                alert('Failed to save: ' + error);
            }
        }

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value;
            return div.innerHTML;
        }

        window.addEventListener('load', () => {
            loadConfig();
        });
    </script>
</body>
</html>
