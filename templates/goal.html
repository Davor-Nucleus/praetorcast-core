<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Objectif</title>
    <!-- Thème commun : police, couleurs et rayons viennent de /settings. -->
    <link id="pc-theme" rel="stylesheet" href="/theme.css">
    <script src="/public/js/theme-live.js" defer></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            /* Fond transparent : la source navigateur OBS se superpose à la scène. */
            background: var(--pc-bg);
            overflow: hidden;
        }

        /* Le rendu d'une barre vient de partials/_goal_bars.html ; il ne reste ici
           que la géométrie du conteneur, propre à cet overlay. */
        #goals {
            font-family: var(--pc-font);
            color: var(--pc-text);
            padding: 1.4rem 1.8rem;
            display: flex;
            flex-direction: column;
            /* Espacement entre deux barres empilées. */
            gap: 1.5rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #goals.ready {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="goals"></div>

    {% include "partials/_goal_bars.html" %}

    <script>
        const root = document.getElementById("goals");
        const goalBars = createGoalBars(root);

        function render(payload) {
            const entries = (payload.goals || [])
                // `visible: false` retire la barre sans qu'on touche à OBS.
                // `showInBanner` ne joue pas ici : c'est l'axe de /banner.
                .filter((e) => e.config && e.config.visible !== false);

            goalBars.render(entries);
            root.classList.add("ready");
        }

        function connect() {
            const scheme = location.protocol === "https:" ? "wss" : "ws";
            const ws = new WebSocket(`${scheme}://${location.host}/api/goal_ws`);

            ws.onmessage = (evt) => {
                try {
                    render(JSON.parse(evt.data));
                } catch (e) {
                    console.error("Charge utile illisible:", e);
                }
            };

            // Même stratégie de reconnexion que les autres overlays : la source OBS
            // ne doit jamais avoir besoin d'être rafraîchie à la main.
            ws.onclose = () => setTimeout(connect, 5000);
            ws.onerror = () => ws.close();
        }

        window.addEventListener("load", connect);
    </script>
</body>
</html>
